const G={el(t,c,p,h){const e=document.createElement(t);e.className=c;e.innerHTML=h||'';p.appendChild(e);return e},artImg(n){return IM[n]?'<img src="data:image/png;base64,'+IM[n]+'">':null}};
const st=document.getElementById('st');let K=1;
function fit(){K=st.clientWidth/1280}
const note=(box,kind,h)=>{const e=G.el('div','s2-note',box,G.artImg('note_'+kind+'_'+(1+(Math.random()*2|0))));e.style.width=(h*.85)+'px';e.style.height=h+'px';return e};
const fly=(e,f,ms)=>{const a=e.animate(f,{duration:ms,easing:'cubic-bezier(.2,.7,.4,1)'});a.finished.then(()=>e.remove())};
function splash(box,size,n){for(let i=0;i<n;i++){const h=size*(.26+Math.random()*.1),e=note(box,'loud',h);
const ang=(i/n+Math.random()*.25)*Math.PI*2,r=size*(.32+Math.random()*.18),dx=Math.cos(ang)*r,dy=Math.sin(ang)*r*.8,rot=(Math.random()-.5)*70;
fly(e,[{transform:'translate(-50%,-50%) scale(.3)',opacity:0},{transform:`translate(-50%,-50%) translate(${dx*.7}px,${dy*.7-size*.14}px) rotate(${rot*.6}deg) scale(1.05)`,opacity:1,offset:.35},{transform:`translate(-50%,-50%) translate(${dx}px,${dy+size*.1}px) rotate(${rot}deg) scale(.75)`,opacity:0}],950+Math.random()*250)}}
function wave(parent,x,y,size,times=1){const m=G.el('div','s2-wave',parent,'');Object.assign(m.style,{left:x+'px',top:y+'px',width:size+'px',height:size+'px'});
const n=3*times,gap=1400/3;for(let i=0;i<n;i++)setTimeout(()=>{const e=note(m,'calm',size*.32),sx=(Math.random()-.5)*size*.4,sw=(Math.random()<.5?-1:1)*size*.08;
fly(e,[{transform:`translate(-50%,-50%) translate(${sx}px,${size*.2}px) scale(.6)`,opacity:0},{transform:`translate(-50%,-50%) translate(${sx+sw}px,${-size*.1}px) scale(1)`,opacity:1,offset:.4},{transform:`translate(-50%,-50%) translate(${sx-sw*.5}px,${-size*.5}px) scale(.9)`,opacity:0}],1600)},i*gap);
setTimeout(()=>m.remove(),n*gap+1700)}
function lab(x,y,t){const l=G.el('div','lab',st,t);l.style.left=x+'%';l.style.top=y+'%'}
lab(25,4,'조용한 곳');lab(75,4,'시끄러운 곳');lab(50,58,'덤불 찾기: 작게 · 중간 · 크게');
const loud=G.el('div','s2-loud',st,'');
function place(){fit();Object.assign(loud.style,{left:(.75*st.clientWidth)+'px',top:(.3*st.clientHeight)+'px',width:170*K+'px',height:170*K+'px'})}
place();addEventListener('resize',place);
(function t(){splash(loud,170*K,4);setTimeout(t,600+Math.random()*250)})();
(function q(){wave(st,.25*st.clientWidth,.33*st.clientHeight,170*K);setTimeout(q,3200)})();
(function b(){[[.3,110],[.5,170],[.7,240]].forEach(([x,s])=>wave(st,x*st.clientWidth,.86*st.clientHeight,s*K));setTimeout(b,2600)})();
</script></body></html>
