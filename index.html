@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Light.otf) format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Bold.otf) format('opentype');font-weight:700;font-style:normal;font-display:swap}
/* 별이 사라진 마을 — 화면 모양 (기획안 16장: 밤 동화책, 크림색 종이, 별빛 노랑) */
:root {
  --u: 1px; --bu: 1px;   /* --bu: 버튼 크기 단위 (휴대폰에서는 손가락 크기 약 11mm를 위해 --u보다 큼) */
                  /* 화면 크기에 맞춘 단위 (1920x1080 기준 1px). main.js가 계속 바꿈 */
  --ts: 1;                  /* 글자 크기 배율 (교사용 설정: 크게 = 1.2) */
  --navy: #2E3A6B; --violet: #5B5A8F; --paper: #FFF8EC; --cream: #FFF4E0; --star: #FFD66B; --lamp: #F4A259;
  --brown: #4A3B32; --wood: #8A6A4E; --ink: #1D2340; --green: #3F7D5A; --sky: #7DBBE3;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --f-title: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;   /* 글꼴은 배민 주아체 하나 (9/29 선생님 요청) */
  --f-body: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --dlgH: max(calc(var(--u) * 170), calc(var(--bu) * 100 + var(--u) * 56));   /* 대화창 높이 (9/29 줄임) */
  color-scheme: dark;
}
html { font-synthesis: none; }   /* 주아체는 굵기가 하나: 가짜 굵게 만들지 않음 */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--f-body); color: var(--brown); }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#game * { box-sizing: border-box; }
/* 9/30: claude.ai 미리보기 문서 틀의 img{max-width:100%} 때문에 밤하늘·지도·인물 그림이 부모 폭으로 줄어들던 것 막기 (점수가 가장 낮아 다른 규칙은 그대로) */
:where(#game) img { max-width: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: calc(var(--u) * 6) solid var(--star); outline-offset: calc(var(--u) * 4); }
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

/* 층 */
.layer { position: absolute; inset: 0; }
#world { overflow: hidden; }
#hud, #dialog, #overlay, #toast { pointer-events: none; }
#hud > *, #dialog > *, #overlay > * { pointer-events: auto; }
#overlay:empty { display: none; }
#fade { background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
#fade.on { opacity: 1; pointer-events: auto; }

/* 공통 버튼 (통통한 알약 + 수채 바탕) */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 12);
  min-height: calc(var(--bu) * 100); min-width: calc(var(--bu) * 100); padding: 0 calc(var(--u) * 34);
  border: calc(var(--u) * 4) solid rgba(74, 59, 50, .55); border-radius: calc(var(--u) * 60);
  background: radial-gradient(ellipse at 30% 25%, #fffdf6 0%, var(--cream) 45%, #f1dfbf 100%);
  box-shadow: 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .35), inset 0 0 calc(var(--u) * 18) rgba(214, 170, 110, .35);
  font-family: var(--f-title); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); cursor: pointer; line-height: 1; }
.pill.gold { background: radial-gradient(ellipse at 30% 25%, #fff6cf 0%, var(--star) 50%, #f0b64a 100%); }
.pill:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 rgba(29, 35, 64, .35); }
.pill .ico, .ico { height: 1.4em; width: auto; flex: none; vertical-align: middle; }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.round { width: calc(var(--bu) * 130); height: calc(var(--bu) * 130); padding: 0; border-radius: 50%; }

/* 타이틀 */
.title-screen { position: absolute; inset: 0; background: #232a4f center / cover no-repeat; }
.title-screen .t-main { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.title-screen h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 150); color: var(--paper);
  text-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .7), 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .6); letter-spacing: .02em; }
.title-screen .t-sub { font-family: var(--f-title); font-size: calc(var(--u) * 54); color: var(--star); margin-top: calc(var(--u) * 10); text-shadow: 0 calc(var(--u) * 4) 0 rgba(29, 35, 64, .6); }
.title-screen .t-lumi { position: absolute; width: calc(var(--u) * 190); left: calc(50% + var(--u) * 470); top: calc(12% + var(--u) * 10); animation: float 3.2s ease-in-out infinite; }
.title-screen .t-start { position: absolute; left: 50%; bottom: calc(18% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320); min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); }
.title-screen .t-note { position: absolute; left: 50%; bottom: calc(8% + var(--sab)); transform: translateX(-50%); width: 90%; text-align: center; font-size: calc(var(--u) * 30); color: var(--cream); text-shadow: 0 1px 3px #000; }
.title-screen .t-ver { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 18); font-size: calc(var(--u) * 24); color: rgba(255, 244, 224, .75); text-align: right; line-height: 1.5; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(calc(var(--u) * -22)) rotate(4deg); } }

/* 저장 칸: 번호 칸 (9/29 그림 고르기 뺌) */
.slots-screen { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3d4a86 0%, #2a3160 60%, #1f2548 100%); display: flex; flex-direction: column;
  padding: calc(var(--sat) + var(--u) * 24) calc(var(--sar) + var(--u) * 40) calc(var(--sab) + var(--u) * 24) calc(var(--sal) + var(--u) * 40); }
.slots-screen .s-head { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 20); min-height: calc(var(--u) * 110); }

/* 인물 그림 (9/29 밤): 상반신 위주로 크게, 허리 아래는 대화창 뒤로(그림 아래 끝은 화면 아래 끝). 서로 마주 보게 왼쪽 25%·오른쪽 75% 둘레에 섬
   층 순서 규칙: 장면 < 인물 그림(#portraits) < 할 일 표시·버튼(#hud) < 가까이 보기 < 대화창·선택지(#dialog) < 창·교사용
   인물 그림은 누를 수 없고 어떤 버튼도 가리지 않음. 새 버튼은 #hud·#dialog·#overlay에 넣으면 저절로 그림 위에 옴 */

  --dlgTopB: calc(var(--sab) + var(--u) * 24 + var(--dlgH)); }   /* 대화창 위 끝의 화면 아래로부터 높이 */

.pgroup { position: absolute; bottom: 0; height: var(--ph); width: max-content; transform: translateX(-50%); transition: opacity .3s, transform .3s; display: flex; align-items: flex-end; }   /* 9/29 밤: 폭을 그림 폭 그대로 (오른쪽 무리가 화면 끝에 눌려 가로로 줄어들던 문제) */
.pgroup.L { left: calc(var(--sal) + 25%); }
.pgroup.R { left: calc(75% - var(--sar)); }
/* 9/30 선생님(폰 캡처): 낮은 휴대폰(주소창·홈 표시줄)에서 대화창이 인물 얼굴을 가림 → 대화창이 그림의 34%보다 더 덮으면 그만큼 그림을 들어 올림 (큰 화면은 그대로) */

.troads .road-arrow { fill: #E2694F; stroke: #FFF5E6; stroke-width: 5; stroke-linejoin: round; opacity: 0; filter: drop-shadow(0 0 6px rgba(255, 245, 230, .9)); }
.tnode { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8e8 0%, #e2cfa6 55%, #b89b6c 100%); box-shadow: 4px 8px 0 rgba(74, 52, 36, .3); }
.tlabel { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FAF3E2;
  box-shadow: 0 0 0 5px rgba(138, 106, 78, .35), 5px 9px 0 rgba(74, 52, 36, .25); transition: box-shadow .3s, background .3s; }
.tlabel svg { display: block; }
.tlabel.sel { background: #FFF8E0; box-shadow: 0 0 0 8px var(--star), 5px 9px 0 rgba(74, 52, 36, .25); }
.tlabel.shine { animation: tshine 1.2s ease-in-out 2; }

.tlabel.hint { animation: thint 1.6s ease-in-out infinite; }
@keyframes thint { 0%, 100% { box-shadow: 0 0 0 5px rgba(138, 106, 78, .35), 0 0 0 rgba(255, 214, 107, 0); } 50% { box-shadow: 0 0 0 10px rgba(255, 214, 107, .85), 0 0 60px rgba(255, 214, 107, .9); } }
.tlabel.found { animation: none; background: #FFF4C8; box-shadow: 0 0 0 10px var(--star), 0 0 70px rgba(255, 214, 107, 1); }
.pz-hit { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; z-index: 3; }
.pz-top { position: absolute; left: calc(var(--sal) + var(--u) * 24); top: calc(var(--sat) + var(--u) * 18); display: flex; align-items: center; gap: calc(var(--u) * 18); max-width: calc(100% - var(--u) * 420); z-index: 4; }
.pz-face { position: relative; flex: none; width: calc(var(--bu) * 130); height: calc(var(--bu) * 130); }
.pz-face-img { width: 100%; height: 100%; border-radius: 50%; border: calc(var(--u) * 5) solid #3AA39A; background-color: #F7EEDC; background-repeat: no-repeat; background-size: 200% auto; background-position: 47% 3%; box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 16) rgba(0, 0, 0, .4); }
.pz-face span { position: absolute; left: 50%; bottom: calc(var(--u) * -14); transform: translateX(-50%); font-family: var(--f-title); font-size: calc(var(--u) * 26); color: var(--paper); background: #3AA39A; border-radius: calc(var(--u) * 20); padding: calc(var(--u) * 2) calc(var(--u) * 14); white-space: nowrap; }
.pz-task { flex: none; }
.pz-say { position: relative; min-width: 0; background: var(--paper); border: calc(var(--u) * 4) solid #3AA39A; border-radius: calc(var(--u) * 28); padding: calc(var(--u) * 14) calc(var(--u) * 26);
  font-family: var(--f-body); font-size: calc(var(--u) * 32 * var(--ts)); color: var(--brown); line-height: 1.3; word-break: keep-all; box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 16) rgba(0, 0, 0, .35); }
.pz-tr { position: absolute; right: calc(var(--sar) + var(--u) * 24); top: calc(var(--sat) + var(--u) * 22); z-index: 4; }
.pz-bl { position: absolute; left: calc(var(--sal) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 24); z-index: 4; }
.pz-tr, .pz-bl, .pz-top { transition: opacity .3s; }
.puzzle.talk .pz-tr, .puzzle.talk .pz-bl { opacity: 0; pointer-events: none; }
.pz-arrow { z-index: 5; width: calc(var(--u) * 90); height: calc(var(--u) * 110); margin: calc(var(--u) * -118) 0 0 calc(var(--u) * -45); }
.pz-zoom { position: absolute; inset: 0; z-index: 6; background: rgba(20, 24, 48, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 30);
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); }
.pz-zmain { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 40); max-width: 100%; min-height: 0; }
.pz-zgrid { display: grid; grid-template-columns: repeat(2, auto); gap: calc(var(--u) * 30); max-width: 100%; }
.pz-zlabel { display: flex; align-items: center; justify-content: center; background: #FAF3E2; border: calc(var(--u) * 5) solid rgba(138, 106, 78, .5); border-radius: calc(var(--u) * 28);
  padding: calc(var(--u) * 22) calc(var(--u) * 30); min-height: calc(var(--bu) * 100); cursor: pointer; }
.pz-zlabel svg { height: min(calc(var(--u) * 130), calc((100vh - var(--sat) - var(--sab) - 150px) / var(--zrows, 2) - 40px)); width: auto; max-width: 100%; display: block; }
.pz-zlabel.hint { animation: thint 1.6s ease-in-out infinite; }
.pz-big { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 5; display: flex; align-items: center; gap: calc(var(--u) * 50);
  background: var(--paper); border: calc(var(--u) * 6) solid var(--star); border-radius: calc(var(--u) * 40); padding: calc(var(--u) * 30) calc(var(--u) * 60); box-shadow: 0 0 calc(var(--u) * 60) rgba(255, 214, 107, .8); }
.pz-big-dots svg { height: calc(var(--u) * 190); width: auto; display: block; }
.pz-big-word { font-family: var(--f-title); font-size: calc(var(--u) * 150); color: var(--brown); line-height: 1; }
/* ---- 도착 연출: 시장 바람, 도서관 문 ---- */
.cut .wind { position: absolute; left: 0; top: 0; width: calc(var(--u) * 30); height: calc(var(--u) * 14); border-radius: 60% 0 60% 0; background: #E9C77B; opacity: 0; }
.door { position: absolute; inset: 0; display: flex; z-index: 3; }
.door-l, .door-r { width: 50%; height: 100%; background: repeating-linear-gradient(90deg, #7a4f30 0 calc(var(--u) * 150), #6a4329 calc(var(--u) * 150) calc(var(--u) * 158));
  box-shadow: inset 0 0 0 calc(var(--u) * 24) #5a3822, inset 0 0 calc(var(--u) * 80) rgba(0, 0, 0, .45); }
.door-l { transform-origin: 0 50%; border-right: calc(var(--u) * 4) solid #3c2616; }
.door-r { transform-origin: 100% 50%; border-left: calc(var(--u) * 4) solid #3c2616; }
.door-light { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(255, 226, 160, .75) 0%, rgba(255, 200, 120, .35) 40%, rgba(255, 190, 110, 0) 75%); mix-blend-mode: screen; }

.cut .warm-glow { position: absolute; width: calc(var(--u) * 500); height: calc(var(--u) * 500); border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255, 226, 160, .85) 0%, rgba(255, 200, 120, .4) 40%, rgba(255, 190, 110, 0) 70%); mix-blend-mode: screen; }
/* 9/30: 낮은 화면(휴대폰 가로)에서 선택지가 3개면 두 줄로 나란히 (화면 위로 넘치지 않게) */
@media (max-height: 520px) {
  .choices { flex-direction: row; flex-wrap: wrap; justify-content: center; width: min(calc(100vw - 24px), calc(var(--u) * 1400)); gap: calc(var(--u) * 16) calc(var(--u) * 24); }
  .choice { min-width: 0; }
}
/* 9/30 인트로 C1: 여러 모양의 별 9개 */
.cut .skystar { position: absolute; animation: sglow 2.6s ease-in-out infinite; }
.cut .skystar svg, .cut .skystar img { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes sglow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 236, 170, .7)); } 50% { filter: drop-shadow(0 0 26px rgba(255, 236, 170, 1)); } }
.cut .sbeam { position: absolute; width: 18px; border-radius: 9px; filter: blur(4px); }
.cut .stail { position: absolute; width: 300px; height: 16px; margin: -8px 0 0 -300px; transform-origin: 100% 50%; border-radius: 8px; background: linear-gradient(90deg, rgba(255, 236, 170, 0), rgba(255, 246, 214, .9)); }
.reduce .cut .skystar { animation: none; filter: drop-shadow(0 0 14px rgba(255, 236, 170, .85)); }
/* 9/30 떨어지는 별: 잔상과 반짝이는 별의 길 */
.cut .sghost { position: absolute; pointer-events: none; opacity: 0; filter: blur(1px) brightness(1.25); }
.cut .sghost svg, .cut .sghost img { width: 100%; height: 100%; display: block; }
.cut .strail { position: absolute; pointer-events: none; animation: strw .5s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px var(--c, #FFD66B)) drop-shadow(0 0 3px #fff); }
.cut .strail svg, .cut .strail img { width: 100%; height: 100%; display: block; }
@keyframes strw { from { filter: drop-shadow(0 0 4px var(--c, #FFD66B)); } to { filter: drop-shadow(0 0 14px var(--c, #FFD66B)) drop-shadow(0 0 4px #fff); } }
.reduce .cut .strail { animation: none; }
/* 9/30 퍼즐 1: 해솔의 점자 카드 (같은 모양 찾기) */
.pz-card { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 10); background: var(--paper); border: calc(var(--u) * 6) solid #3AA39A; border-radius: calc(var(--u) * 32);
  padding: calc(var(--u) * 18) calc(var(--u) * 26); box-shadow: 0 calc(var(--u) * 10) 0 rgba(40, 30, 20, .25); box-sizing: border-box; }
.pz-card.center { left: 50%; top: 40%; transform: translate(-50%, -50%); }
.pz-card.side { right: calc(var(--sar) + var(--u) * 24); top: 20%; overflow: hidden; }
.pz-card-head { font-family: var(--f-title); font-size: calc(var(--u) * 30); color: #2F8F8A; white-space: nowrap; }
.pz-card-dots svg { display: block; height: calc(var(--u) * 170); width: auto; max-width: 70vw; }
.pz-card.side .pz-card-dots svg { height: calc(var(--u) * 96); max-width: 24vw; }
.pz-card-word { font-family: var(--f-title); font-size: calc(var(--u) * 90); line-height: 1; color: var(--brown); visibility: hidden; }
.pz-card.side .pz-card-word { font-size: calc(var(--u) * 64); }
.pz-card.show-word .pz-card-word { visibility: visible; }
.pz-card.show-empty svg circle[stroke] { animation: pzEmpty 1s ease-in-out infinite; }
@keyframes pzEmpty { 50% { fill: #FFD66B; stroke: #C98F14; } }
.pz-card.show-raised svg circle[fill^="url"] { transform-box: fill-box; transform-origin: center; animation: pzRaised .9s ease-in-out infinite; }
@keyframes pzRaised { 50% { transform: scale(1.35); } }
.pz-card.look { box-shadow: 0 0 0 calc(var(--u) * 8) var(--star), 0 calc(var(--u) * 10) 0 rgba(40, 30, 20, .25); }
.pz-card rect.on, .tlabel rect.on { fill: #FFE9A8; stroke: #F2B705; stroke-width: 4; transition: fill .3s; }
.pz-card.match { box-shadow: 0 0 0 calc(var(--u) * 8) var(--star), 0 0 calc(var(--u) * 60) rgba(255, 214, 107, .9); }
.pz-zoom .pz-card { position: static; transform: none; }
.pz-zoom .pz-card .pz-card-word { visibility: visible; font-size: calc(var(--u) * 60); }
.pz-zoom .pz-card-dots svg { height: calc(var(--u) * 110); }
.reduce .pz-card.show-empty svg circle[stroke], .reduce .pz-card.show-raised svg circle[fill^="url"] { animation-iteration-count: 2; }
/* 9/30 가방 아이템 큰 그림 팝업 */
.item-pop .sheet { text-align: center; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); max-width: 94vw; max-height: 94vh; box-sizing: border-box; overflow: auto; }
.item-pop-pic { width: calc(var(--u) * 300); height: calc(var(--u) * 300); display: flex; align-items: center; justify-content: center; }
.item-pop-pic .ico { width: 100%; height: 100%; object-fit: contain; }
.item-pop-pic.art { width: auto; height: auto; }
.item-pop-pic.art img { display: block; max-width: min(84vw, calc(var(--u) * 1300)); max-height: 56vh; border-radius: calc(var(--u) * 24); box-shadow: 0 calc(var(--u) * 8) 0 rgba(74, 52, 36, .2); }
/* 9/30 코드 그림 대신 선생님 그림 (assets/ui/art) */
img.art { display: block; width: 100%; height: 100%; object-fit: contain; }
.marker img.art { overflow: visible; }
.marker.open img.art { animation: breathe 2s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); }
.marker img.pin-locked { filter: grayscale(1) brightness(.85); opacity: .7; }
.cut .wind.art { background: none; width: calc(var(--u) * 60); height: calc(var(--u) * 60); border-radius: 0; }
.door.art .door-l, .door.art .door-r { background: none; border: 0; position: relative; overflow: hidden; }
.door.art .door-img { position: absolute; top: 0; width: 200%; height: 100%; object-fit: cover; pointer-events: none; }
.door.art .door-l .door-img { left: 0; }
.door.art .door-r .door-img { right: 0; }
/* 9/30: 돌 테두리는 고정, 문짝만 열림 (그림 3장이 같은 크기라 겹쳐 놓음) */
.door.art2 .door-l, .door.art2 .door-r { position: absolute; inset: 0; width: auto; background: none; border: 0; }
.door.art2 .door-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.door.art2 .door-frame { z-index: 1; }
.book-big.art { position: relative; aspect-ratio: 3 / 2; width: min(80vw, calc(var(--u) * 1300)); max-height: calc(100vh - var(--dlgH) - var(--u) * 60); max-width: calc((100vh - var(--dlgH) - var(--u) * 60) * 1.5); background: #3a3442 center / cover no-repeat; border-radius: calc(var(--u) * 26); overflow: hidden; box-shadow: 0 calc(var(--u) * 24) calc(var(--u) * 60) rgba(0, 0, 0, .5); padding: 0; container-type: size; }
/* 선생님 그림(book_open): 왼쪽 큰 쪽 가운데에 점자 낱말을 놓음. 10/1 책 위·아래 선에 맞춰 비스듬하게(-9도) */
.book-big.art .book-page { position: absolute; left: 18%; right: 18%; top: 16%; bottom: 18%; transform: rotate(-9deg); background: none; box-shadow: none; border-radius: 0; padding: 0; justify-content: center; align-items: center; }
.book-big.art .book-line svg { height: min(calc(var(--u) * 170), 24cqh); max-width: 100%; }
.tboard.art { background-size: cover; background-position: center; border-radius: 24px; box-shadow: 0 40px 80px rgba(0, 0, 0, .55); }   /* 판 그림에 나무 테두리가 있어 코드 테두리는 뺌 */
.tboard.art .road, .tboard.art .road-sh, .tboard.art .road-hi, .tboard.art .tnode { display: none; }
.sigh img.art { opacity: 1; }
/* 9/30 장 제목 화면 */
.cut.chapter { background: #0d1024; }
.ch-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.ch-bg.dim { filter: brightness(.45) saturate(.8); }
.ch-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(10, 12, 30, .5) 0%, rgba(10, 12, 30, .35) 60%, rgba(10, 12, 30, .6) 100%); }   /* 9/30 글씨 뒤를 조금 더 어둡게 (그림 배경에서 제목이 잘 읽히게) */
.ch-box { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); text-align: center; }
.ch-num { color: #E9D7A6; }
.ch-line { width: calc(var(--u) * 560); max-width: 80vw; height: calc(var(--u) * 26); display: flex; align-items: center; }
.ch-line i { display: block; width: 100%; height: calc(var(--u) * 3); background: linear-gradient(90deg, rgba(233, 215, 166, 0), #E9D7A6 15%, #E9D7A6 85%, rgba(233, 215, 166, 0)); }
.ch-line img.art { width: 100%; height: 100%; object-fit: contain; }
.ch-title { color: #FFF6D6; }
/* 9/30 장 제목 글꼴: 마루부리 (장 제목 화면에만). 다른 장에도 그대로 쓰는 공용 클래스. 글꼴이 없으면 명조 계열로 */
:root { --f-chapter: 'MaruBuri', 'Nanum Myeongjo', 'Noto Serif KR', 'AppleMyungjo', 'Batang', serif; }
.chapter-number { font-family: var(--f-chapter); font-weight: 300; font-size: calc(var(--u) * 42); letter-spacing: .34em; padding-left: .34em; line-height: 1.2;
  color: #EADCB4; text-shadow: 0 1px calc(var(--u) * 10) rgba(8, 10, 28, .55); }
.chapter-title { font-family: var(--f-chapter); font-weight: 700; font-size: calc(var(--u) * 104); letter-spacing: .07em; padding-left: .07em; line-height: 1.35;
  color: #FFF6DE; text-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 16) rgba(8, 10, 28, .6); word-break: keep-all; max-width: 90vw; }
/* 9/30 난이도 보통: 찾아야 하는 곳은 반짝이지 않음 */
.hot-glow.hide { opacity: 0 !important; }
.pz-card .pz-card-word, .pz-zoom .pz-card .pz-card-word { visibility: visible; }
.pz-card-word .w { display: none; } .pz-card.show-word .pz-card-word .w { display: inline; } .pz-card.show-word .pz-card-word .q { display: none; }
.pz-card-word .q { color: #C98F14; }

/* 9/30 선생님: 휴대폰·태블릿용 [선생님 설정] 버튼 (ESC 대신, 왼쪽 가장자리 가운데, 교사용 창보다 위) */
.tbtn { position: absolute; left: calc(var(--sal) + 4px); top: 50%; transform: translateY(-50%); z-index: 45; width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
  background: rgba(29, 35, 64, .5); color: var(--cream); font: 13px var(--f-body); opacity: .75; cursor: pointer; }
.tbtn img { width: 32px; height: 32px; display: block; margin: auto; }
img.scene-sprite { image-rendering: pixelated; }   /* 9/30 선생님: 장소 장면 인물도 픽셀 그림 (scene_px.py) */
/* 9/30 선생님: 지도에서 장소에 도착하면 [○○ 들어가기] 버튼 (화면 아래 가운데) */
.enter-btn { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 48); transform: translateX(-50%); font-size: calc(var(--u) * 44); min-height: max(calc(var(--u) * 110), calc(var(--bu) * 100)); padding-inline: calc(var(--u) * 48); white-space: nowrap; animation: flash 1.6s ease-in-out infinite; }
/* 10/1 누를 때 .pill:active 가 translateX(-50%)를 지워 버튼이 오른쪽으로 튀어 클릭이 빗나가던 문제: 가운데 정렬을 유지한 채 눌림 */
.enter-btn:active, .title-screen .t-start:active { transform: translateX(-50%) translateY(calc(var(--u) * 4)); }

/* ---- 9/30 프로토타입 3: 숲, 두 번째 광장, 퍼즐 2, 별 얻기, 엔딩 ---- */
.leafpuff { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; pointer-events: none; z-index: 25; }
.leafpuff img { width: 100%; height: 100%; object-fit: contain; }
.wavemark { position: absolute; width: calc(var(--u) * 140); height: calc(var(--u) * 140); pointer-events: none; z-index: 26; transform: translate(-50%, -50%); filter: drop-shadow(0 0 12px rgba(125, 187, 227, .9)); }
.world .wavemark { width: 160px; height: 160px; }
.wavemark img { width: 100%; height: 100%; object-fit: contain; }
.firefly { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none; z-index: 4;
  background: radial-gradient(circle, #FBFFD0 0%, #E8F29A 35%, rgba(232, 242, 154, 0) 70%); animation: ffly 7s ease-in-out infinite; }
.firefly.art { width: 60px; height: 60px; margin: -30px 0 0 -30px; background: none; }
.firefly img { width: 100%; height: 100%; object-fit: contain; }
.cut .firefly { width: calc(var(--u) * 26); height: calc(var(--u) * 26); animation: none; }
@keyframes ffly { 0%, 100% { translate: 0 0; opacity: .3; } 25% { translate: 30px -24px; opacity: 1; } 50% { translate: 60px 4px; opacity: .5; } 75% { translate: 20px 26px; opacity: 1; } }
.reduce .firefly { animation: none; opacity: .8; }
.p3tw { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; pointer-events: none; z-index: 12; }
.p3tw img, .p3tw svg { width: 100%; height: 100%; object-fit: contain; }
.qmark { position: absolute; width: 90px; height: 90px; transform: translate(-50%, -100%); pointer-events: none; z-index: 30; display: flex; align-items: center; justify-content: center; }
.qmark img { width: 100%; height: 100%; object-fit: contain; }

.p4-tmark img { width: 110px; height: 110px; object-fit: contain; }
.p4-tmark.door { flex-direction: row; }
.p4-tpal { position: absolute; display: flex; flex-direction: column; gap: 40px; }
.p4-tblock { width: 240px; height: 270px; border-radius: 26px; border: 6px solid #e0b96a; background: #FFF4E0; padding: 14px; cursor: grab; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--f-title); font-size: 38px; color: var(--brown); }
.p4-tblock img { width: 170px; height: 170px; object-fit: contain; pointer-events: none; }
.p4-tblock.sel, .p4-tblock.hint { animation: thint 1.6s ease-in-out infinite; border-color: #ffd400; }
/* 별가루 보너스 별자리 */
.p4-bonus { position: absolute; inset: 0; background: rgba(10, 12, 32, .6); pointer-events: none; }
.p4-bbox { position: absolute; left: 50%; top: 46%; width: min(70vw, 70vh); height: min(70vw, 70vh); transform: translate(-50%, -50%); }
.p4-bonus svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.p4-bline { fill: none; stroke: rgba(255, 230, 150, .9); stroke-width: 6; stroke-linejoin: round; filter: drop-shadow(0 0 10px rgba(255, 214, 107, .9)); }
.p4-bstar { position: absolute; width: 12%; height: 12%; transform: translate(-50%, -50%); }
.p4-bstar img, .p4-bstar svg { position: static; width: 100%; height: 100%; }

/* 10/1 제 1장 앞 양피지 안으로 들어가기 (그림 parchment_open 1376x768, 빈 종이 가운데 자리에 제 1장 그림이 번짐) */
.cut.parch-in { background: #1d2340; }
.pi-cam { position: absolute; inset: 0; transform-origin: 50% 49%; }
.pi-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.pi-win { position: absolute; left: 25%; top: 15%; width: 50%; height: 70%; background-size: cover; background-position: center;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

/* 10/1 퍼즐 화면의 층(z-index)이 대화창 위로 새어 나가지 않게 (점자 자물쇠에서 대화창이 가려져 넘어가지 않던 문제) */
.puzzle { isolation: isolate; }
.p4-dust.pop { animation: none; }
.walker .wgift { position: absolute; left: -22px; top: -150px; width: 44px; height: 44px; pointer-events: none; animation: tw 2.2s ease-in-out infinite; }
.walker .wgift img, .walker .wgift svg { width: 100%; height: 100%; }
/* 10/1 찢어진 지도 조각: 모양은 clip-path, 그림자·고른 표시는 drop-shadow (모양을 따라감) */
.p4-jslot.torn { border: 0; background: rgba(255, 244, 224, .16); }
.p4-jslot.torn.filled { background: transparent; }
.p4-piece.torn { background: transparent; box-shadow: none; outline: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .55)); }
.p4-piece.torn.lift { filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .6)); }
.p4-piece.torn.sel, .p4-piece.torn.hint { outline: none; filter: drop-shadow(0 0 6px #ffd66b) drop-shadow(0 0 6px #ffd66b) drop-shadow(0 8px 10px rgba(0, 0, 0, .5)); }
.p4-piece.torn.placed { filter: none; }
.p4-pc { position: absolute; inset: 0; background-repeat: no-repeat; pointer-events: none; }
/* 10/1 가방 마을 지도(실제 지도 + 이름표)와 촌장님 쪽지 */
.item-pop-pic.item-map { position: relative; }
.item-map .im-tag { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: 1em; color: var(--brown); background: rgba(255, 248, 232, .94);
  border: calc(var(--u) * 3) solid #c9a27a; border-radius: 999px; padding: .05em .6em; white-space: nowrap; box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 8) rgba(0, 0, 0, .3); pointer-events: none; }
.item-pop-pic.item-note { width: min(84vw, calc(var(--u) * 820), 100vh); height: auto; }
.map-pop .item-pop-pic.art img { width: min(84vw, calc((94vh - 230px) * 1.78), calc(var(--u) * 1500)); height: auto; max-height: none; max-width: none; }   /* 10/1 마을 지도는 크게 (이름표가 읽히게) */
@media (max-height: 520px) { .map-pop .get-desc { display: none; } .map-pop .item-pop-pic.art img { width: min(84vw, calc((94vh - 150px) * 1.78)); } }
.item-note .p4-note { width: 100%; }
.item-note .p4-note-head { font-size: calc(var(--u) * 46); }
.mstar.p4-askq { z-index: 30; width: 76px; height: 76px; margin: -76px 0 0 -38px; animation: askBob 1.4s ease-in-out infinite; font-family: var(--f-title); font-size: 64px; color: #ffd66b; text-align: center; }
.mstar.p4-askq img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .9)); }
@keyframes askBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.p4-mapstar { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); animation: mapStar 3s ease-in-out infinite; }
@keyframes mapStar { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -56%) scale(1.06); } }
.p4-mapstar img, .p4-mapstar svg { width: 100%; height: 100%; object-fit: contain; }
.item-note .p4-note-head .ico { width: auto; height: 1.4em; }
/* 10/1 도서관 앞 안내 기둥 (마을 지도 시점 이동, 지도 표시) */
.p4-libview { position: absolute; inset: 0; overflow: hidden; background: #1d2340; z-index: 50; }
.p4-lv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.p4-lv-world > img:first-child { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.p4-lv-pole, .p4-mpole { position: absolute; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .7)); }
.p4-libview .wavemark { z-index: 2; width: 44px; height: 44px; }
/* 10/1 밤하늘 보기 (가방 옆 단추) */
.modal.sky-view { background-color: #141832; background-size: cover; background-position: center; display: block; }
.sky-view .sky-count { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 40); transform: translateX(-50%); }
.sky-view .sky-close { position: absolute; right: calc(var(--sar) + var(--u) * 30); top: calc(var(--sat) + var(--u) * 30); }
/* 10/1 별 축제 불꽃놀이 */
.fw-dot { position: absolute; width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; pointer-events: none; z-index: 40; }
.fw-img { position: absolute; pointer-events: none; z-index: 40; object-fit: contain; }
.p4-tboard.art { background-color: #4b5a4a; background-repeat: no-repeat; overflow: hidden; }
.p4-tboard.art .p4-tcell:not(.has) { background: rgba(255, 255, 255, .12); }

/* 10/1 별 축제 알림 종이 (선생님 그림) */
.pz2-slots { position: relative; }
.pz2-paper { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; object-fit: contain; z-index: 2; pointer-events: none; transform-origin: 50% 0; animation: pz2-pin .8s ease-out both; transition: opacity .5s; }
.pz2-paper.off { opacity: 0; }
@keyframes pz2-pin { from { opacity: 0; transform: translateY(-12%) rotate(-4deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pz2-paper { animation: none; } }
