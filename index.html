@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Light.otf) format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Bold.otf) format('opentype');font-weight:700;font-style:normal;font-display:swap}
/* 별이 사라진 마을 — 화면 모양 (기획안 16장: 밤 동화책, 크림색 종이, 별빛 노랑) */
:root {
  --u: 1px; --bu: 1px;   /* --bu: 버튼 크기 단위 (휴대폰에서는 손가락 크기 약 11mm를 위해 --u보다 큼) */
                  /* 화면 크기에 맞춘 단위 (1920x1080 기준 1px). main.js가 계속 바꿈 */
  --ts: 1;                  /* 글자 크기 배율 (교사용 설정: 크게 = 1.2) */
  --navy: #2E3A6B; --violet: #5B5A8F; --paper: #FFF8EC; --cream: #FFF4E0; --star: #FFD66B; --lamp: #F4A259;
  --brown: #4A3B32; --wood: #8A6A4E; --ink: #1D2340; --green: #3F7D5A; --sky: #7DBBE3;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --vw: 1vw; --vh: 1vh;
  --f-title: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;   /* 글꼴은 배민 주아체 하나 (9/29 선생님 요청) */
  --f-body: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --dlgH: max(calc(var(--u) * 170), calc(var(--bu) * 100 + var(--u) * 56));   /* 대화창 높이 (9/29 줄임) */
  color-scheme: dark;
}
html { font-synthesis: none; }   /* 주아체는 굵기가 하나: 가짜 굵게 만들지 않음 */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--f-body); color: var(--brown); }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#game * { box-sizing: border-box; }
/* 9/30: claude.ai 미리보기 문서 틀의 img{max-width:100%} 때문에 밤하늘·지도·인물 그림이 부모 폭으로 줄어들던 것 막기 (점수가 가장 낮아 다른 규칙은 그대로) */
:where(#game) img { max-width: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: calc(var(--u) * 6) solid var(--star); outline-offset: calc(var(--u) * 4); }
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

/* 층 */
.layer { position: absolute; inset: 0; }
#world { overflow: hidden; }
#hud, #dialog, #overlay, #toast { pointer-events: none; }
#hud > *, #dialog > *, #overlay > * { pointer-events: auto; }
#overlay:empty { display: none; }
#fade { background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
#fade.on { opacity: 1; pointer-events: auto; }

/* 공통 버튼 (통통한 알약 + 수채 바탕) */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 12);
  min-height: calc(var(--bu) * 100); min-width: calc(var(--bu) * 100); padding: 0 calc(var(--u) * 34);
  border: calc(var(--u) * 4) solid rgba(74, 59, 50, .55); border-radius: calc(var(--u) * 60);
  background: radial-gradient(ellipse at 30% 25%, #fffdf6 0%, var(--cream) 45%, #f1dfbf 100%);
  box-shadow: 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .35), inset 0 0 calc(var(--u) * 18) rgba(214, 170, 110, .35);
  font-family: var(--f-title); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); cursor: pointer; line-height: 1; }
.pill.gold { background: radial-gradient(ellipse at 30% 25%, #fff6cf 0%, var(--star) 50%, #f0b64a 100%); }
.pill:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 rgba(29, 35, 64, .35); }
.pill .ico, .ico { height: 1.4em; width: auto; flex: none; vertical-align: middle; }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.round { width: calc(var(--bu) * 130); height: calc(var(--bu) * 130); padding: 0; border-radius: 50%; }

/* 타이틀 */
.title-screen { position: absolute; inset: 0; background: #232a4f center / cover no-repeat; }
.title-screen .t-main { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.title-screen h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 150); color: var(--paper);
  text-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .7), 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .6); letter-spacing: .02em; }
.title-screen .t-sub { font-family: var(--f-title); font-size: calc(var(--u) * 54); color: var(--star); margin-top: calc(var(--u) * 10); text-shadow: 0 calc(var(--u) * 4) 0 rgba(29, 35, 64, .6); }
.title-screen .t-lumi { position: absolute; width: calc(var(--u) * 190); left: calc(50% + var(--u) * 470); top: calc(12% + var(--u) * 10); animation: float 3.2s ease-in-out infinite; }
.title-screen .t-start { position: absolute; left: 50%; bottom: calc(18% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320); min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); }
.title-screen .t-note { position: absolute; left: 50%; bottom: calc(8% + var(--sab)); transform: translateX(-50%); width: 90%; text-align: center; font-size: calc(var(--u) * 30); color: var(--cream); text-shadow: 0 1px 3px #000; }
.title-screen .t-ver { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 18); font-size: calc(var(--u) * 24); color: rgba(255, 244, 224, .75); text-align: right; line-height: 1.5; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(calc(var(--u) * -22)) rotate(4deg); } }

/* 저장 칸: 번호 칸 (9/29 그림 고르기 뺌) */
.slots-screen { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3d4a86 0%, #2a3160 60%, #1f2548 100%); display: flex; flex-direction: column;
  padding: calc(var(--sat) + var(--u) * 24) calc(var(--sar) + var(--u) * 40) calc(var(--sab) + var(--u) * 24) calc(var(--sal) + var(--u) * 40); }
.slots-screen .s-head { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 20); min-height: calc(var(--u) * 110); }
.slots-screen .s-head h2 { margin: 0; font-family: var(--f-title); font-weight: 400; color: var(--paper); font-size: calc(var(--u) * 48 * var(--ts)); }
.slots-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: var(--cardH, calc(var(--u) * 220)); gap: calc(var(--u) * 22); overflow-y: auto; padding: calc(var(--u) * 8); min-height: 0; }
.slot-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 4);

/* 대화 (U5) */
.dlg-wrap { position: absolute; inset: 0; }
.dlg-hit { position: absolute; inset: 0; }
/* 인물 그림 (9/29 밤): 상반신 위주로 크게, 허리 아래는 대화창 뒤로(그림 아래 끝은 화면 아래 끝). 서로 마주 보게 왼쪽 25%·오른쪽 75% 둘레에 섬
   층 순서 규칙: 장면 < 인물 그림(#portraits) < 할 일 표시·버튼(#hud) < 가까이 보기 < 대화창·선택지(#dialog) < 창·교사용
   인물 그림은 누를 수 없고 어떤 버튼도 가리지 않음. 새 버튼은 #hud·#dialog·#overlay에 넣으면 저절로 그림 위에 옴 */

  --ph: min(calc(var(--u) * 860), calc(100% - var(--sat) - 11%), calc(var(--vw) * 45), calc((100% - var(--sat) - 4% - var(--dlgTopB)) / 0.74));   /* 그림 높이: 화면 폭의 45%를 넘지 않게 (두 인물이 겹치지 않게). 9/30: 들어 올려도 인물과 머리 뒤 루미(-8%) 위가 잘리지 않게 */
  --dlgTopB: calc(var(--sab) + var(--u) * 24 + var(--dlgH)); }   /* 대화창 위 끝의 화면 아래로부터 높이 */
#portraits * { pointer-events: none; }
#portraits.on { background: rgba(20, 24, 48, .18); }
#portraits.look { background: transparent; }   /* "눌러 봐" 대사: 그림이 아래로 비켜서 누를 곳이 다 보임 */

#portraits:empty { display: none; }
.pgroup { position: absolute; bottom: 0; height: var(--ph); width: max-content; transform: translateX(-50%); transition: opacity .3s, transform .3s; display: flex; align-items: flex-end; }   /* 9/29 밤: 폭을 그림 폭 그대로 (오른쪽 무리가 화면 끝에 눌려 가로로 줄어들던 문제) */
.pgroup.L { left: calc(var(--sal) + 25%); }
.pgroup.R { left: calc(75% - var(--sar)); }
/* 9/30 선생님(폰 캡처): 낮은 휴대폰(주소창·홈 표시줄)에서 대화창이 인물 얼굴을 가림 → 대화창이 그림의 34%보다 더 덮으면 그만큼 그림을 들어 올림 (큰 화면은 그대로) */
.pgroup { bottom: max(0px, calc(var(--dlgTopB) - var(--ph) * 0.34)); }

/* 9/30 인트로 C1: 여러 모양의 별 9개 */
/* 10/4 폰 끊김: 빛 번짐(filter)을 움직이면 매 순간 다시 그려서, 번짐은 고정하고 뒤의 둥근 빛만 커졌다 작아짐 */
.cut .skystar { position: absolute; }

.cut .skystar::before { content: ''; position: absolute; inset: -45%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 170, .75) 0%, rgba(255, 236, 170, .3) 35%, rgba(255, 236, 170, 0) 65%); animation: sglow 2.6s ease-in-out infinite; }
@keyframes sglow { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
.cut .sbeam { position: absolute; width: 18px; border-radius: 9px; filter: blur(4px); }
.cut .stail { position: absolute; width: 300px; height: 16px; margin: -8px 0 0 -300px; transform-origin: 100% 50%; border-radius: 8px; background: linear-gradient(90deg, rgba(255, 236, 170, 0), rgba(255, 246, 214, .9)); }
.reduce .cut .skystar::before { animation: none; opacity: .6; }
/* 9/30 떨어지는 별: 잔상과 반짝이는 별의 길 */
.cut .sghost { position: absolute; pointer-events: none; opacity: 0; filter: blur(1px) brightness(1.25); }
.cut .sghost svg, .cut .sghost img { width: 100%; height: 100%; display: block; }

.cut .strail svg, .cut .strail img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 8px var(--c, #FFD66B)) drop-shadow(0 0 3px #fff); }   /* 10/4: 번짐은 고정, 반짝임은 cutscene.js fade 안에서 */
/* 9/30 퍼즐 1: 해솔의 점자 카드 (같은 모양 찾기) */
.pz-card { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 10); background: var(--paper); border: calc(var(--u) * 6) solid #3AA39A; border-radius: calc(var(--u) * 32);
  padding: calc(var(--u) * 18) calc(var(--u) * 26); box-shadow: 0 calc(var(--u) * 10) 0 rgba(40, 30, 20, .25); box-sizing: border-box; }
.pz-card.center { left: 50%; top: 40%; transform: translate(-50%, -50%); }
.pz-card.side { right: calc(var(--sar) + var(--u) * 24); top: 20%; overflow: hidden; }
.pz-card-head { font-family: var(--f-title); font-size: calc(var(--u) * 30); color: #2F8F8A; white-space: nowrap; }
.pz-card-dots svg { display: block; height: calc(var(--u) * 170); width: auto; max-width: calc(var(--vw) * 70); }
.pz-card.side .pz-card-dots svg { height: calc(var(--u) * 96); max-width: calc(var(--vw) * 24); }
.pz-card-word { font-family: var(--f-title); font-size: calc(var(--u) * 90); line-height: 1; color: var(--brown); visibility: hidden; }

.item-pop .sheet { text-align: center; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); max-width: calc(var(--vw) * 94); max-height: calc(var(--vh) * 94); box-sizing: border-box; overflow: auto; }
.item-pop-pic { width: calc(var(--u) * 300); height: calc(var(--u) * 300); display: flex; align-items: center; justify-content: center; }

.item-pop-pic.art img { display: block; max-width: min(calc(var(--vw) * 84), calc(var(--u) * 1300)); max-height: calc(var(--vh) * 56); border-radius: calc(var(--u) * 24); box-shadow: 0 calc(var(--u) * 8) 0 rgba(74, 52, 36, .2); }
/* 9/30 코드 그림 대신 선생님 그림 (assets/ui/art) */

.book-big.art .book-page { position: absolute; left: 24%; right: 26%; top: 16%; bottom: 18%; transform: rotate(-9deg) skewX(13deg);   /* 10/6 왼쪽 쪽 기울기에 맞춤 */ background: none; box-shadow: none; border-radius: 0; padding: 0; justify-content: center; align-items: center; }

.cut.chapter { background: #0d1024; }
.ch-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.ch-bg.dim { filter: brightness(.45) saturate(.8); }
.ch-bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(10, 12, 30, .5) 0%, rgba(10, 12, 30, .35) 60%, rgba(10, 12, 30, .6) 100%); }   /* 9/30 글씨 뒤를 조금 더 어둡게 (그림 배경에서 제목이 잘 읽히게) */
.ch-box { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 14); text-align: center; }

.ch-line i { display: block; width: 100%; height: calc(var(--u) * 3); background: linear-gradient(90deg, rgba(233, 215, 166, 0), #E9D7A6 15%, #E9D7A6 85%, rgba(233, 215, 166, 0)); }
.ch-line img.art { width: 100%; height: 100%; object-fit: contain; }

/* 9/30 선생님: 지도에서 장소에 도착하면 [○○ 들어가기] 버튼 (화면 아래 가운데) */
.enter-btn { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 48); transform: translateX(-50%); font-size: calc(var(--u) * 44); min-height: max(calc(var(--u) * 110), calc(var(--bu) * 100)); padding-inline: calc(var(--u) * 48); white-space: nowrap; animation: flash 1.6s ease-in-out infinite; }
/* 10/1 누를 때 .pill:active 가 translateX(-50%)를 지워 버튼이 오른쪽으로 튀어 클릭이 빗나가던 문제: 가운데 정렬을 유지한 채 눌림 */
.enter-btn:active, .title-screen .t-start:active { transform: translateX(-50%) translateY(calc(var(--u) * 4)); }

/* ---- 9/30 프로토타입 3: 숲, 두 번째 광장, 퍼즐 2, 별 얻기, 엔딩 ---- */
.leafpuff { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; pointer-events: none; z-index: 25; }
.leafpuff img { width: 100%; height: 100%; object-fit: contain; }
.wavemark { position: absolute; width: calc(var(--u) * 140); height: calc(var(--u) * 140); pointer-events: none; z-index: 26; transform: translate(-50%, -50%); filter: drop-shadow(0 0 12px rgba(125, 187, 227, .9)); }
.world .wavemark { width: 160px; height: 160px; }
.wavemark img { width: 100%; height: 100%; object-fit: contain; }
.firefly { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; pointer-events: none; z-index: 4;
  background: radial-gradient(circle, #FBFFD0 0%, #E8F29A 35%, rgba(232, 242, 154, 0) 70%); animation: ffly 7s ease-in-out infinite; }
.firefly.art { width: 60px; height: 60px; margin: -30px 0 0 -30px; background: none; }
.firefly img { width: 100%; height: 100%; object-fit: contain; }
.cut .firefly { width: calc(var(--u) * 26); height: calc(var(--u) * 26); animation: none; }
@keyframes ffly { 0%, 100% { translate: 0 0; opacity: .3; } 25% { translate: 30px -24px; opacity: 1; } 50% { translate: 60px 4px; opacity: .5; } 75% { translate: 20px 26px; opacity: 1; } }
.reduce .firefly { animation: none; opacity: .8; }
.p3tw { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; pointer-events: none; z-index: 12; }
.p3tw img, .p3tw svg { width: 100%; height: 100%; object-fit: contain; }
.qmark { position: absolute; width: 90px; height: 90px; transform: translate(-50%, -100%); pointer-events: none; z-index: 30; display: flex; align-items: center; justify-content: center; }
.qmark img { width: 100%; height: 100%; object-fit: contain; }
.qmark span { width: 76px; height: 76px; border-radius: 50%; background: var(--paper); border: 5px solid var(--star); font-family: var(--f-title); font-size: 56px; line-height: 66px; text-align: center; color: #8a5a0a; }
.scene-sprite.shine { filter: brightness(1.25) drop-shadow(0 0 16px rgba(255, 214, 107, 1)); }
.pathlight { position: absolute; width: calc(var(--u) * 60); height: calc(var(--u) * 60); margin: calc(var(--u) * -30) 0 0 calc(var(--u) * -30); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255, 244, 180, .95) 0%, rgba(255, 214, 107, .6) 40%, rgba(255, 214, 107, 0) 70%); }
.piece-glow { position: absolute; left: 50%; top: 42%; width: calc(var(--u) * 260); height: calc(var(--u) * 260);   /* 10/6: 그림(piece_glow)을 84% 칸으로 맞춰 15%쯤 작아짐 */ transform: translate(-50%, -50%); pointer-events: none; opacity: 0; }
.piece-glow img { width: 100%; height: 100%; object-fit: contain; }
.c11-item { position: absolute; width: calc(var(--u) * 110); height: calc(var(--u) * 110); transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .9)); }
.c11-item .ico { width: 100%; height: 100%; }
.c11-pillar { position: absolute; width: calc(var(--u) * 160); height: calc(var(--vh) * 120); transform-origin: 50% 100%; pointer-events: none;
  background: linear-gradient(to top, rgba(255, 244, 190, .95), rgba(255, 214, 107, .5) 40%, rgba(255, 214, 107, 0)); filter: blur(4px); mix-blend-mode: screen; }
.c11-star { position: absolute; width: calc(var(--u) * 162); height: calc(var(--u) * 162); transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 24px rgba(255, 244, 190, 1)); }
.c11-star img, .c11-star svg, .star-pic img, .star-pic svg { width: 100%; height: 100%; display: block; object-fit: contain; }
.c11-sky { position: absolute; inset: 0; background-size: cover; background-position: center; }
.c11-slot { position: absolute; width: calc(var(--u) * 110); height: calc(var(--u) * 110); transform: translate(-50%, -50%); opacity: .18; filter: grayscale(1); transition: opacity .6s, filter .6s; }
.c11-slot.me { width: calc(var(--u) * 150); height: calc(var(--u) * 150); }
.c11-slot.lit { opacity: 1; filter: drop-shadow(0 0 26px rgba(255, 244, 190, 1)); }
.c11-slot.next { filter: drop-shadow(0 0 18px rgba(200, 170, 230, .9)); }
.c11-slot img, .c11-slot svg { width: 100%; height: 100%; object-fit: contain; }
.c11-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.c11-lines polyline { fill: none; stroke: rgba(255, 244, 200, .8); stroke-width: 3; stroke-dasharray: 8 10; }
.c11-title { top: 22%; }
.c12-saved { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: calc(var(--u) * 90); color: var(--paper); white-space: nowrap;
  background: rgba(46, 58, 107, .8); border: calc(var(--u) * 6) solid var(--star); border-radius: calc(var(--u) * 60); padding: calc(var(--u) * 20) calc(var(--u) * 60); display: flex; align-items: center; gap: calc(var(--u) * 20); }
.c12-saved .ico { width: calc(var(--u) * 100); height: calc(var(--u) * 100); }
.starget .sheet { text-align: center; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 6); }
.star-pic { width: calc(var(--u) * 238); height: calc(var(--u) * 238); filter: drop-shadow(0 0 30px rgba(255, 214, 107, .95)); }
.star-count { display: flex; align-items: center; gap: calc(var(--u) * 12); font-family: var(--f-title); font-size: calc(var(--u) * 40); color: var(--brown); background: #FFF1C4; border-radius: calc(var(--u) * 40); padding: calc(var(--u) * 6) calc(var(--u) * 28); margin: calc(var(--u) * 8) 0; }
.star-count .ico { width: calc(var(--u) * 48); height: calc(var(--u) * 48); }
/* 퍼즐 2: 게시판 바꾸기 */
.pz2 { background: radial-gradient(ellipse at 50% 40%, #3b4a7a 0%, #2a335c 55%, #1b2146 100%); }
.pz2.art { background-size: cover; background-position: center top; }
.pz2-board { position: absolute; left: 50%; top: calc(var(--sat) + var(--u) * 40); transform: translateX(-50%); width: min(62%, calc(var(--u) * 1180)); height: 56%;
  background: #C8A77E; border: calc(var(--u) * 22) solid #8A6A4E; border-radius: calc(var(--u) * 20); box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 50) rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: calc(var(--u) * 18); padding: calc(var(--u) * 24); box-sizing: border-box; }
.pz2-board.art { background: none; border-radius: 0; border: calc(var(--u) * 40) solid transparent; border-image-slice: 56 58 61 58 fill; border-image-width: calc(var(--u) * 40); box-shadow: none; filter: drop-shadow(0 calc(var(--u) * 16) calc(var(--u) * 30) rgba(0, 0, 0, .5)); }   /* 10/1 선생님 게시판 그림 */
.pz2-note { background: #F7F2E6; color: var(--brown); font-family: var(--f-body); font-size: calc(var(--u) * 24); padding: calc(var(--u) * 10) calc(var(--u) * 18); border-radius: calc(var(--u) * 8);
  box-shadow: 2px 4px 0 rgba(74, 52, 36, .25); transition: font-size .5s, padding .5s; white-space: nowrap; }
.pz2-note.big { font-family: var(--f-title); font-size: calc(var(--u) * 58); padding: calc(var(--u) * 14) calc(var(--u) * 30); }
.pz2-note.reading { box-shadow: 0 0 0 calc(var(--u) * 6) var(--star), 2px 4px 0 rgba(74, 52, 36, .25); }
.pz2-slots { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; gap: calc(var(--u) * 16); }
.pz2-slot { border: calc(var(--u) * 4) dashed rgba(74, 52, 36, .35); border-radius: calc(var(--u) * 14); display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; transition: box-shadow .3s; }
.pz2-slot.pic { grid-row: 1 / 3; }
.pz2-slot.on { border: 0; background: #F7F2E6; box-shadow: 2px 5px 0 rgba(74, 52, 36, .25); }
.pz2-slot.pic img { width: 100%; height: 100%; object-fit: contain; }
.pz2-slot.braille svg { height: calc(var(--u) * 70); width: auto; max-width: 96%; }
.pz2-slot.shine, .pz2-note.shine { box-shadow: 0 0 0 calc(var(--u) * 8) var(--star), 0 0 calc(var(--u) * 50) rgba(255, 214, 107, .95); }
.pz2-tmp { display: flex; align-items: center; justify-content: center; gap: 6%; width: 100%; height: 100%; }
.pz2-tmp .ico { width: 45%; height: auto; max-height: 90%; }
.pz2-tmp span { width: 30%; aspect-ratio: 1; display: block; }
.pz2-tmp span svg, .pz2-tmp span img { width: 100%; height: 100%; }
.pz2-sound { font-size: calc(var(--u) * 34); }
.pz2-people { position: absolute; left: calc(var(--sal) + var(--u) * 20); top: calc(var(--sat) + var(--u) * 30); display: flex; flex-direction: column; gap: calc(var(--u) * 22); z-index: 4; }
.pz2-face { position: relative; width: calc(var(--bu) * 118); height: calc(var(--bu) * 118); padding: 0; border: 0; background: none; cursor: pointer; }
.pz2-face-img { width: 100%; height: 100%; border-radius: 50%; border: calc(var(--u) * 5) solid var(--paper); background-color: #F7EEDC; background-repeat: no-repeat; background-size: 200% auto; background-position: 47% 3%; box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 16) rgba(0, 0, 0, .4); }
.pz2-face span { position: absolute; left: 50%; bottom: calc(var(--u) * -12); transform: translateX(-50%); font-family: var(--f-title); font-size: calc(var(--u) * 24); color: var(--paper); background: #5B5A8F; border-radius: calc(var(--u) * 20); padding: 0 calc(var(--u) * 12); white-space: nowrap; }
.pz2-face.asked .pz2-face-img { border-color: var(--star); }
.pz2-people.glow .pz2-face-img { animation: thint 1.2s ease-in-out 2; }
.pz2-cards { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 20); transform: translateX(-50%); display: flex; gap: calc(var(--u) * 24); z-index: 4; transition: opacity .4s; }
.pz2-card { width: calc(var(--bu) * 170); height: calc(var(--bu) * 210); border: 0; border-radius: calc(var(--u) * 18); background: var(--paper); box-shadow: 0 calc(var(--u) * 8) 0 rgba(74, 52, 36, .35); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 8); padding: calc(var(--u) * 10); box-sizing: border-box; transition: opacity .3s, transform .2s; }
.pz2-card.art { background-color: transparent; background-size: 100% 100%; box-shadow: none; }
.pz2-card:active { transform: scale(.96); }
.pz2-card.used { opacity: .25; pointer-events: none; }
.pz2-card.hint { animation: thint 1.6s ease-in-out infinite; }
.pz2-card-pic { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.pz2-card-pic .ico, .pz2-card-pic img { max-width: 80%; max-height: 100%; object-fit: contain; }
.pz2-card-pic svg { width: 90%; height: auto; }
.pz2-ga { font-family: var(--f-title); font-size: calc(var(--bu) * 100); color: var(--brown); line-height: 1; }
.pz2-card-label { font-family: var(--f-title); font-size: calc(var(--u) * 32); color: var(--brown); }
.pz2-fly { position: fixed; z-index: 60; pointer-events: none; background: var(--paper); border-radius: calc(var(--u) * 18); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.pz2-fly .ico, .pz2-fly img { max-width: 70%; max-height: 60%; }
.pz2-say { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); z-index: 5; }
.pz2-close { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 40); transform: translateX(-50%); z-index: 5; }
.pz2-close .wait { opacity: .45; }
@media (max-height: 560px) { .pz2-people { display: grid; grid-template-columns: repeat(2, auto); gap: calc(var(--u) * 26) calc(var(--u) * 14); } }   /* 휴대폰 가로: 주민 얼굴 2줄 (루미 버튼과 겹치지 않게) */
.puzzle.talk .pz2-cards { opacity: 0; pointer-events: none; }   /* 대화 중에는 카드가 대화창을 가리지 않게 */

/* ===== 10/1 프로토타입 4: 방탈출 요소 (p4.js) ===== */
.hot-glow.obj { opacity: 1; animation: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); }
.hot-glow.obj.seen { display: block; }
.hot-glow.obj.strong { animation: glows 1s ease-in-out infinite; }
.p4-board { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-size: 100% 100%; }
.p4-arrow { z-index: 8; width: calc(var(--u) * 90); height: calc(var(--u) * 110); margin: calc(var(--u) * -118) 0 0 calc(var(--u) * -45); }
.p4-ghost { position: fixed; z-index: 9999; pointer-events: none; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .45)); }
.p4-ghost img { width: 90%; height: 90%; object-fit: contain; }
.dragging { opacity: .35; }
.drop-on { outline: calc(var(--u) * 8) solid rgba(255, 214, 107, .95); outline-offset: calc(var(--u) * 4); }
/* 가방 칸 (아이템 끌어 쓰기) */
.p4-tray { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 24); transform: translateX(-50%); z-index: 7; display: flex; align-items: center; gap: calc(var(--u) * 18);
  background: rgba(255, 248, 236, .95); border: calc(var(--u) * 4) solid rgba(138, 106, 78, .55); border-radius: calc(var(--u) * 34); padding: calc(var(--u) * 12) calc(var(--u) * 24); }
.p4-tray-head { font-family: var(--f-title); font-size: calc(var(--u) * 30); color: var(--brown); white-space: nowrap; }
.p4-item { width: calc(var(--bu) * 150); height: calc(var(--bu) * 150); border-radius: calc(var(--u) * 26); border: calc(var(--u) * 5) solid #e0b96a; background: #fff6dc; padding: 0; cursor: grab; display: flex; align-items: center; justify-content: center; }
.p4-item img { width: 86%; height: 86%; object-fit: contain; }
.p4-item.sel, .p4-item.hint { animation: thint 1.6s ease-in-out infinite; }
.p4-target { cursor: pointer; }
.p4-target-on { animation: thint 1.6s ease-in-out infinite; border-radius: calc(var(--u) * 20); }
/* 도서관 문 */
.puzzle.p4-door { background: #1b1f3a; }
.p4-doorbg { background-size: 100% 100%; }
.p4-plate { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.p4-plate img { width: 100%; height: auto; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .4)); }
.p4-q { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; z-index: 3001; pointer-events: none; animation: bob 1.6s ease-in-out infinite; font-family: var(--f-title); font-size: 80px; color: var(--star); text-align: center; line-height: 90px; }
.p4-q img { width: 100%; height: 100%; object-fit: contain; }
/* 점자 자물쇠 */
.p4-lock { position: absolute; z-index: 5; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 40); }
.p4-lock::before { content: ''; position: fixed; inset: 0; background: rgba(15, 18, 38, .55); z-index: -1; }
.p4-lock.col { flex-direction: column; gap: calc(var(--u) * 20); }
.p4-note { flex: none; box-sizing: border-box; background: #FFF4E0; border: calc(var(--u) * 5) solid #e0b96a; border-radius: calc(var(--u) * 26); padding: calc(var(--u) * 16) calc(var(--u) * 22); box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 24) rgba(0, 0, 0, .4); transform: rotate(-2deg); }
.p4-note.look { animation: thint 1.2s ease-in-out 2; }
.p4-note-head { font-family: var(--f-title); font-size: calc(var(--u) * 30); color: var(--brown); display: flex; align-items: center; gap: calc(var(--u) * 10); margin-bottom: calc(var(--u) * 8); white-space: nowrap; }
.p4-note-head .ico { height: 1.6em; }
.p4-note-dots svg { width: 100%; height: auto; display: block; }
.p4-lock-main { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 26); min-width: 0; }
.p4-lockplate { position: relative; flex: none; }
.p4-lockplate > img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .5)); }
.p4-cell { position: absolute; }
.p4-cell.lit { box-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .95); border-radius: calc(var(--u) * 10); background: rgba(255, 230, 150, .35); transition: all .3s; }
.p4-dot { position: absolute; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; padding: 0; border: 3px solid rgba(74, 59, 50, .55); background: radial-gradient(circle at 50% 60%, rgba(60, 40, 20, .35), rgba(120, 90, 50, .15)); box-shadow: inset 0 3px 5px rgba(0, 0, 0, .45); cursor: default; transition: transform .12s, background .12s; }
button.p4-dot { cursor: pointer; }
.p4-cell.open::after { content: ''; position: absolute; inset: -4%; border: 3px dashed rgba(255, 244, 224, .7); border-radius: 10px; pointer-events: none; }
.p4-dot.on { border-color: #6b4a24; background: radial-gradient(circle at 35% 30%, #fff1c4, #e3b25a 55%, #9a6a2a); box-shadow: 0 4px 0 #7a5220, 0 6px 8px rgba(0, 0, 0, .4); transform: translate(-50%, -62%); }
.p4-dot.hint { animation: thint 1.4s ease-in-out infinite; }
.p4-bplate { flex: none; border: 0; padding: 0 8%; background: #C9A45C center / 100% 100% no-repeat; border-radius: calc(var(--u) * 20); cursor: pointer; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .45)); }
.p4-bplate svg { width: 100%; height: auto; display: block; }
.p4-bplate.hint { animation: thint 1.6s ease-in-out infinite; }
.p4-bplate.right { box-shadow: 0 0 0 calc(var(--u) * 8) rgba(255, 214, 107, .95), 0 0 60px rgba(255, 214, 107, .9); }
/* 숨은 별가루 */
.p4-dust { position: absolute; width: 96px; height: 96px; transform: translate(-50%, -50%); padding: 0; border: 0; background: transparent; cursor: pointer; z-index: 22; animation: tw 2.6s ease-in-out infinite; }
.p4-dust img, .p4-dust svg { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.p4-dust.dim { opacity: .55; }
.p4-dust-pop { position: absolute; transform: translate(-50%, -50%); z-index: 40; pointer-events: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-family: var(--f-title); font-size: 46px; color: #fff6cf; text-shadow: 0 2px 6px rgba(0, 0, 0, .7); animation: p4pop 2.4s ease-out forwards; }
.p4-dust-pop img { width: 60px; height: 60px; }
@keyframes p4pop { 0% { opacity: 0; margin-top: 20px; } 15% { opacity: 1; margin-top: 0; } 75% { opacity: 1; } 100% { opacity: 0; margin-top: -30px; } }
.p4-bagdust { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 10); font-family: var(--f-title); font-size: calc(var(--u) * 32); color: var(--brown); margin: calc(var(--u) * -10) 0 calc(var(--u) * 20); }
.p4-bagdust img { height: calc(var(--u) * 56); width: auto; }
/* 어두운 숲 */
.p4-dark { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; }
/* 게시판 닦기 */
.puzzle.p4-wipe, .puzzle.p4-jig, .puzzle.p4-tiles { background: radial-gradient(ellipse at 50% 45%, #3c4470 0%, #262c52 60%, #171b36 100%); }
.p4-wboard { background-color: #c9a27a; border-radius: 18px; box-shadow: 0 30px 60px rgba(0, 0, 0, .55); }
.p4-paper { position: absolute; box-sizing: border-box; background: #FAF3E2; border-radius: 6px; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 6px 10px rgba(0, 0, 0, .3); }
.p4-paper i { display: block; height: 12px; border-radius: 6px; background: #9c8f80; }
.p4-dustcv { position: absolute; left: 2.6%; top: 5.5%; width: 94.8%; height: 89%; border-radius: 6px; cursor: pointer; }   /* 나무 테두리는 보이게 */
/* 지도 조각 */
.p4-jghost { position: absolute; background-size: 100% 100%; opacity: .22; border-radius: 10px; box-shadow: 0 0 0 6px rgba(255, 244, 224, .35); transition: opacity .8s; }
.p4-jslot { position: absolute; box-sizing: border-box; border: 4px dashed rgba(255, 244, 224, .45); }
.p4-jslot.filled { border-color: transparent; }
.p4-jslot.hint { animation: thint 1.6s ease-in-out infinite; }
.p4-piece { position: absolute; left: 0; top: 0; transform-origin: 0 0; border: 0; padding: 0; background-repeat: no-repeat; box-shadow: 0 10px 18px rgba(0, 0, 0, .5); cursor: grab; z-index: 2; }

/* 반딧불 소리 자물쇠 */
.puzzle.p4-ff { background: radial-gradient(ellipse at 50% 55%, #1e3a2e 0%, #10241c 55%, #08130f 100%); }

.p4-fly { position: absolute; width: 230px; height: 230px; margin: -115px 0 0 -115px; border: 0; padding: 0; background: radial-gradient(circle, rgba(255, 236, 140, .35), rgba(255, 236, 140, 0) 65%); border-radius: 50%; cursor: pointer; animation: bob 2.2s ease-in-out infinite; transition: transform .15s, filter .15s, opacity .8s; }
.p4-fly img { width: 70%; height: 70%; object-fit: contain; pointer-events: none; filter: brightness(.75); }

/* 별가루 보너스 별자리 */

/* 10/1 제 1장 앞 양피지 안으로 들어가기 (그림 parchment_open 1376x768, 빈 종이 가운데 자리에 제 1장 그림이 번짐) */

  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

/* 10/1 퍼즐 화면의 층(z-index)이 대화창 위로 새어 나가지 않게 (점자 자물쇠에서 대화창이 가려져 넘어가지 않던 문제) */
.puzzle { isolation: isolate; }

/* 10/1 찢어진 지도 조각: 모양은 clip-path, 그림자·고른 표시는 drop-shadow (모양을 따라감) */
.p4-jslot.torn { border: 0; background: rgba(255, 244, 224, .16); }

.p4-piece.torn.sel, .p4-piece.torn.hint { outline: none; filter: drop-shadow(0 0 6px #ffd66b) drop-shadow(0 0 6px #ffd66b) drop-shadow(0 8px 10px rgba(0, 0, 0, .5)); }

.p4-pc { position: absolute; inset: 0; background-repeat: no-repeat; pointer-events: none; }
/* 10/1 가방 마을 지도(실제 지도 + 이름표)와 촌장님 쪽지 */

.item-map .im-tag { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: 1em; color: var(--brown); background: rgba(255, 248, 232, .94);
  border: calc(var(--u) * 3) solid #c9a27a; border-radius: 999px; padding: .05em .6em; white-space: nowrap; box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 8) rgba(0, 0, 0, .3); pointer-events: none; }

.map-pop .item-pop-pic.art img { width: min(calc(var(--vw) * 84), calc((calc(var(--vh) * 94) - 230px) * 1.78), calc(var(--u) * 1500)); height: auto; max-height: none; max-width: none; }   /* 10/1 마을 지도는 크게 (이름표가 읽히게) */

.p4-mapstar { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); animation: mapStar 3s ease-in-out infinite; }
@keyframes mapStar { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -56%) scale(1.06); } }

/* 10/1 밤하늘 보기 (가방 옆 단추) */
.modal.sky-view { background-color: #141832; background-size: cover; background-position: center; display: block; }
.sky-view .sky-count { position: absolute; left: 50%; top: calc(var(--sat) + var(--u) * 30); transform: translateX(-50%); }
.sky-view .sky-close { position: absolute; right: calc(var(--sar) + var(--u) * 30); top: calc(var(--sat) + var(--u) * 30); }

/* 10/1 별 축제 알림 종이 (선생님 그림) */

.pz2-paper { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; object-fit: contain; z-index: 2; pointer-events: none; transform-origin: 50% 0; animation: pz2-pin .8s ease-out backwards; transition: opacity .6s; }

@keyframes pz2-pin { from { opacity: 0; transform: translateY(-12%) rotate(-4deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pz2-paper { animation: none; } }

/* 10/1 장소를 끝내면 가운데 큰 지도로 버튼 */
.hud-go { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; z-index: 5; }
.hud-go .pill { font-size: calc(var(--u) * 56 * var(--ts)); min-height: calc(var(--bu) * 130); padding: 0 calc(var(--u) * 64); animation: hud-go-in .5s ease-out both, hud-go-pulse 1.6s ease-in-out .5s infinite; }

@media (prefers-reduced-motion: reduce) { .hud-go .pill { animation: none; } }

/* 10/2 제목·글귀: 선생님 붓글씨 그림 (단색, 테두리 없음, 아래로 옅은 그림자만) */

  background: radial-gradient(ellipse 34% 52% at 50% 36%, rgba(16, 20, 52, .5), rgba(16, 20, 52, .22) 60%, transparent 100%); }
.title-screen.tb .tb-open, .title-screen.tb .t-start { position: absolute; left: 50%; bottom: calc(6% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320);

  box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 6) rgba(60, 40, 20, .22); }   /* 10/4 선생님: 연한 버터색 종이, 짙은 갈색 테두리, 아래로 아주 약한 그림자 */

.puzzle.s2-box { background: linear-gradient(rgba(40, 28, 18, .45), rgba(40, 28, 18, .55)), var(--bg-s2rest, none) center / cover no-repeat, #5a3d28; }

/* 10/2 선생님: 저장 칸 = 제목 화면의 책 (save.js bookPick). 양피지 쪽 + 가운데 수채 그림 + 나눔손글씨 */
.slots-screen.bk-screen { background: linear-gradient(rgba(20, 12, 6, .25), rgba(20, 12, 6, .45)), var(--desk) center / cover no-repeat, #3b2617; }

.bk-area { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.bk-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.bk-book { position: absolute; left: 335px; top: 105px; width: 1250px; height: 805px; }
.bk-page { background: #f3e2c0; }
.bk-paper { position: absolute; inset: 0; background: center / 100% 100% no-repeat; }

.bk-ill { position: absolute; left: 30px; right: 30px; top: 60px; bottom: 150px; background: center / cover no-repeat; mix-blend-mode: multiply; opacity: .95; filter: saturate(.85);
  -webkit-mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); }

.bk-board { position: absolute; left: 293px; top: 69px; width: 1334px; height: 877px; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .5)); }
.bk-cv { position: absolute; top: 0; bottom: 0; width: 50%; background: center / cover no-repeat #3c3f86; border: 3px solid #23264f; box-shadow: inset 0 0 26px rgba(10, 10, 40, .55); }
