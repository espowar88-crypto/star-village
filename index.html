@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Light.otf) format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Bold.otf) format('opentype');font-weight:700;font-style:normal;font-display:swap}
/* 별이 사라진 마을 — 화면 모양 (기획안 16장: 밤 동화책, 크림색 종이, 별빛 노랑) */
:root {
  --u: 1px; --bu: 1px;   /* --bu: 버튼 크기 단위 (휴대폰에서는 손가락 크기 약 11mm를 위해 --u보다 큼) */
                  /* 화면 크기에 맞춘 단위 (1920x1080 기준 1px). main.js가 계속 바꿈 */
  --ts: 1;                  /* 글자 크기 배율 (교사용 설정: 크게 = 1.2) */
  --navy: #2E3A6B; --violet: #5B5A8F; --paper: #FFF8EC; --cream: #FFF4E0; --star: #FFD66B; --lamp: #F4A259;
  --brown: #4A3B32; --wood: #8A6A4E; --ink: #1D2340; --green: #3F7D5A; --sky: #7DBBE3;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --vw: 1vw; --vh: 1vh;
  --f-title: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;   /* 글꼴은 배민 주아체 하나 (9/29 선생님 요청) */
  --f-body: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --dlgH: max(calc(var(--u) * 170), calc(var(--bu) * 100 + var(--u) * 56));   /* 대화창 높이 (9/29 줄임) */
  color-scheme: dark;
}
html { font-synthesis: none; }   /* 주아체는 굵기가 하나: 가짜 굵게 만들지 않음 */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--f-body); color: var(--brown); }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#game * { box-sizing: border-box; }
/* 9/30: claude.ai 미리보기 문서 틀의 img{max-width:100%} 때문에 밤하늘·지도·인물 그림이 부모 폭으로 줄어들던 것 막기 (점수가 가장 낮아 다른 규칙은 그대로) */
:where(#game) img { max-width: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: calc(var(--u) * 6) solid var(--star); outline-offset: calc(var(--u) * 4); }
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

/* 층 */
.layer { position: absolute; inset: 0; }
#world { overflow: hidden; }
#hud, #dialog, #overlay, #toast { pointer-events: none; }
#hud > *, #dialog > *, #overlay > * { pointer-events: auto; }
#overlay:empty { display: none; }
#fade { background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
#fade.on { opacity: 1; pointer-events: auto; }

/* 공통 버튼 (통통한 알약 + 수채 바탕) */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 12);
  min-height: calc(var(--bu) * 100); min-width: calc(var(--bu) * 100); padding: 0 calc(var(--u) * 34);
  border: calc(var(--u) * 4) solid rgba(74, 59, 50, .55); border-radius: calc(var(--u) * 60);
  background: radial-gradient(ellipse at 30% 25%, #fffdf6 0%, var(--cream) 45%, #f1dfbf 100%);
  box-shadow: 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .35), inset 0 0 calc(var(--u) * 18) rgba(214, 170, 110, .35);
  font-family: var(--f-title); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); cursor: pointer; line-height: 1; }
.pill.gold { background: radial-gradient(ellipse at 30% 25%, #fff6cf 0%, var(--star) 50%, #f0b64a 100%); }
.pill:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 rgba(29, 35, 64, .35); }
.pill .ico, .ico { height: 1.4em; width: auto; flex: none; vertical-align: middle; }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.round { width: calc(var(--bu) * 130); height: calc(var(--bu) * 130); padding: 0; border-radius: 50%; }

/* 타이틀 */
.title-screen { position: absolute; inset: 0; background: #232a4f center / cover no-repeat; }
.title-screen .t-main { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.title-screen h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 150); color: var(--paper);
  text-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .7), 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .6); letter-spacing: .02em; }
.title-screen .t-sub { font-family: var(--f-title); font-size: calc(var(--u) * 54); color: var(--star); margin-top: calc(var(--u) * 10); text-shadow: 0 calc(var(--u) * 4) 0 rgba(29, 35, 64, .6); }
.title-screen .t-lumi { position: absolute; width: calc(var(--u) * 190); left: calc(50% + var(--u) * 470); top: calc(12% + var(--u) * 10); animation: float 3.2s ease-in-out infinite; }
.title-screen .t-start { position: absolute; left: 50%; bottom: calc(18% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320); min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); }
.title-screen .t-note { position: absolute; left: 50%; bottom: calc(8% + var(--sab)); transform: translateX(-50%); width: 90%; text-align: center; font-size: calc(var(--u) * 30); color: var(--cream); text-shadow: 0 1px 3px #000; }
.title-screen .t-ver { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 18); font-size: calc(var(--u) * 24); color: rgba(255, 244, 224, .75); text-align: right; line-height: 1.5; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(calc(var(--u) * -22)) rotate(4deg); } }

/* 저장 칸: 번호 칸 (9/29 그림 고르기 뺌) */
.slots-screen { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3d4a86 0%, #2a3160 60%, #1f2548 100%); display: flex; flex-direction: column;
  padding: calc(var(--sat) + var(--u) * 24) calc(var(--sar) + var(--u) * 40) calc(var(--sab) + var(--u) * 24) calc(var(--sal) + var(--u) * 40); }
.slots-screen .s-head { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 20); min-height: calc(var(--u) * 110); }
.slots-screen .s-head h2 { margin: 0; font-family: var(--f-title); font-weight: 400; color: var(--paper); font-size: calc(var(--u) * 48 * var(--ts)); }

/* 대화 (U5) */

/* 인물 그림 (9/29 밤): 상반신 위주로 크게, 허리 아래는 대화창 뒤로(그림 아래 끝은 화면 아래 끝). 서로 마주 보게 왼쪽 25%·오른쪽 75% 둘레에 섬
   층 순서 규칙: 장면 < 인물 그림(#portraits) < 할 일 표시·버튼(#hud) < 가까이 보기 < 대화창·선택지(#dialog) < 창·교사용

  --ph: min(calc(var(--u) * 860), calc(100% - var(--sat) - 11%), calc(var(--vw) * 45), calc((100% - var(--sat) - 4% - var(--dlgTopB)) / 0.74));   /* 그림 높이: 화면 폭의 45%를 넘지 않게 (두 인물이 겹치지 않게). 9/30: 들어 올려도 인물과 머리 뒤 루미(-8%) 위가 잘리지 않게 */
  --dlgTopB: calc(var(--sab) + var(--u) * 24 + var(--dlgH)); }   /* 대화창 위 끝의 화면 아래로부터 높이 */

/* 9/30 선생님(폰 캡처): 낮은 휴대폰(주소창·홈 표시줄)에서 대화창이 인물 얼굴을 가림 → 대화창이 그림의 34%보다 더 덮으면 그만큼 그림을 들어 올림 (큰 화면은 그대로) */
.pgroup { bottom: max(0px, calc(var(--dlgTopB) - var(--ph) * 0.34)); }
.pgroup.solo { bottom: 0; }   /* 혼자 뜬 루미는 원래 대화창 위에 맞춰 둠 */
.pgroup img { display: block; flex: none; transition: filter .25s, transform .25s; transform-origin: 50% 100%; transform: scaleX(var(--fx, 1)); }
.pgroup img.flip { --fx: -1; }   /* 그림을 좌우로 뒤집어 상대 쪽을 보게 */
.pgroup .pmain { height: calc(100% * var(--ps, 1)); width: auto; }   /* --ps: 인물 크기 (주인공은 어린이라 0.9) */
.pgroup .pmain { position: relative; z-index: 1; }
.pgroup .pmain { height: calc(100% * var(--ps, 1) * var(--ext, 1)); translate: 0 calc(100% * var(--exd, 0)); transform-origin: 50% calc(100% * (1 - var(--exd, 0))); }   /* 10/4: 길게 자른 그림은 늘어난 아래쪽(--exd)만큼 내려 대화창 뒤에 숨김. 말할 때 커지는 기준도 원래 아래 끝 */
.pgroup .plumi { position: absolute; z-index: 0; height: 34%; width: auto; left: -16%; top: -8%; transform-origin: 50% 50%; animation: pbob 2.4s ease-in-out infinite; }   /* 상대가 있을 때: 주인공 뒤통수 쪽 위 (9/29 밤 선생님 요청: 앞쪽이 아니라 머리 뒤, 9/30: 머리에 가리지 않게 조금 위로, 겹치지 않게) */
.pgroup.solo .plumi { position: static; margin-bottom: calc(var(--sab) + var(--u) * 54 + var(--dlgH));   /* 상대가 없을 때: 오른쪽에서 주인공과 마주 봄. 대화창 위에 떠 있음 */
  height: min(56%, calc(100% - var(--sab) - var(--u) * 54 - var(--dlgH) - 3%)); }
@keyframes pbob { 0%, 100% { translate: 0 0; } 50% { translate: 0 calc(var(--u) * -12); } }   /* 둥실둥실 (뒤집기·말할 때 커지기와 겹치지 않게 translate로) */
.pgroup .dim { filter: brightness(.55) saturate(.8); }
.pgroup .pmain.speak { transform: scale(1.03) scaleX(var(--fx, 1)); }
.pgroup .plumi.speak { transform: scale(1.06) scaleX(var(--fx, 1)); }   /* 루미 그림에 빛 번짐이 들어 있어 따로 빛을 더하지 않음 */
.pgroup.enter { opacity: 0; transform: translateX(-50%) translateY(calc(var(--u) * 30)); }
#game.talking .hud-tl, #game.talking .hud-tr, #game.talking .hud-bl, #game.talking .hud-br, #game.talking .bubble { opacity: 0; pointer-events: none; }
.hud-tl, .hud-tr, .hud-bl, .hud-br { transition: opacity .3s; }
.dlg-box { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 24); transform: translateX(-50%); width: min(calc(100% - 24px), calc(var(--u) * 1400)); min-height: var(--dlgH);
  display: flex; align-items: center; gap: calc(var(--u) * 24);
  background: var(--paper); border: calc(var(--u) * 4) solid rgba(138, 106, 78, .75); border-radius: calc(var(--u) * 34);
  box-shadow: 0 0 0 calc(var(--u) * 10) rgba(255, 244, 224, .25), inset 0 0 calc(var(--u) * 40) rgba(214, 170, 110, .35), 0 calc(var(--u) * 14) calc(var(--u) * 40) rgba(0, 0, 0, .45);
  padding: calc(var(--u) * 30) calc(var(--u) * 22) calc(var(--u) * 22) calc(var(--u) * 48); }
.dlg-name { position: absolute; left: calc(var(--u) * 36); top: calc(var(--u) * -28); font-family: var(--f-title); font-size: calc(var(--u) * 32 * var(--ts)); background: var(--cream); color: var(--brown);
  border: calc(var(--u) * 4) solid rgba(138, 106, 78, .75); border-radius: calc(var(--u) * 26); padding: calc(var(--u) * 5) calc(var(--u) * 24) calc(var(--u) * 3); border-left: calc(var(--u) * 18) solid var(--band, var(--star)); }
.dlg-name:empty { display: none; }
.dlg-text { flex: 1; min-width: 0; font-family: var(--f-body); font-size: max(calc(var(--u) * 36 * var(--ts)), calc(var(--bu) * 30 * var(--ts))); line-height: 1.45; color: var(--brown); word-break: keep-all; }
.dlg-btns { flex: none; display: flex; align-items: center; gap: calc(var(--u) * 14); }
.dlg-replay { width: calc(var(--bu) * 100); height: calc(var(--bu) * 100); min-width: 0; min-height: 0; padding: 0; border-radius: 50%; }
.dlg-replay .ico { height: 52%; }
.dlg-next { min-height: calc(var(--bu) * 100); padding: 0 calc(var(--u) * 28); font-size: calc(var(--u) * 36 * var(--ts)); }
.dlg-next.wait { opacity: .35; }
.dlg-next.ready { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(calc(var(--u) * 8)); } }
.choices { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 64 + var(--dlgH)); transform: translateX(-50%); display: flex; flex-direction: column; gap: calc(var(--u) * 24); align-items: center; }
.choice { min-width: calc(var(--u) * 440); min-height: calc(var(--bu) * 110); font-size: calc(var(--u) * 44 * var(--ts)); }
.choice.armed { outline: calc(var(--u) * 10) solid var(--star); outline-offset: calc(var(--u) * 6); }
.subtitle { position: absolute; left: 50%; bottom: calc(var(--sab) + var(--u) * 50); transform: translateX(-50%); max-width: min(calc(100% - 24px), calc(var(--u) * 1500)); text-align: center;
  font-family: var(--f-body); font-size: calc(var(--u) * 38 * var(--ts)); color: var(--paper); background: rgba(29, 35, 64, .72); border-radius: calc(var(--u) * 26); padding: calc(var(--u) * 14) calc(var(--u) * 40); word-break: keep-all; pointer-events: none; }

/* 연출 (U8) */
.cut { position: absolute; inset: 0; overflow: hidden; background: #1b2146; }
.cut-layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; pointer-events: none; }
.cut-title { position: absolute; left: 50%; top: 30%; font-family: var(--f-title); font-size: calc(var(--u) * 130); color: var(--paper); text-shadow: 0 0 30px rgba(255, 214, 107, .9), 0 6px 0 rgba(29, 35, 64, .7); white-space: nowrap; transform: translate(-50%, -50%); }
.cut-big { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: calc(var(--u) * 150); color: var(--star); text-shadow: 0 0 40px rgba(255, 214, 107, .9), 0 8px 0 rgba(29, 35, 64, .7); white-space: nowrap; }
.skip { font-size: calc(var(--u) * 34); }
.star-fall { width: 520px; height: 80px; }
.star-fall .tail { position: absolute; right: 40px; top: 30px; width: 480px; height: 20px; border-radius: 10px; background: linear-gradient(90deg, rgba(255, 214, 107, 0), rgba(255, 236, 170, .9)); filter: blur(3px); }
.star-fall .head { position: absolute; right: 0; top: 0; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #fff 0 12%, #ffe9a8 25%, rgba(255, 214, 107, .5) 45%, rgba(255, 214, 107, 0) 70%); }
.flare { width: 900px; height: 600px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255, 246, 214, .95) 0 6%, rgba(255, 214, 107, .55) 25%, rgba(255, 214, 107, 0) 65%); mix-blend-mode: screen; }
.twinkle { animation: tw 2.2s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* 게시판 가까이 보기 */
.closeup { position: absolute; inset: 0; background: rgba(15, 18, 38, .8); display: flex; align-items: center; justify-content: center; }
.board-big { box-sizing: border-box; width: min(calc(var(--u) * 900), calc((calc(var(--vh) * 100) - var(--sat) - var(--sab) - var(--dlgH) - var(--u) * 80) * 1.5)); aspect-ratio: 3 / 2; height: auto;   /* 9/30: 낮은 휴대폰에서 게시판이 위로 잘리지 않게 */ border-radius: calc(var(--u) * 18); background: #3a3446; border: calc(var(--u) * 28) solid #6E4630; box-shadow: 0 0 0 calc(var(--u) * 6) #4a2f20, 0 calc(var(--u) * 30) calc(var(--u) * 60) rgba(0, 0, 0, .6);
  display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 30); padding: calc(var(--u) * 40); margin-bottom: calc(var(--dlgH) + var(--u) * 40); overflow: hidden; }
.board-big .note { background: #56506a; border-radius: calc(var(--u) * 6); padding: calc(var(--u) * 26); display: flex; flex-direction: column; gap: calc(var(--u) * 18); }
.board-big .note i { display: block; height: calc(var(--u) * 14); border-radius: calc(var(--u) * 7); background: #6a6480; }

/* 가방 */
.bag-slots { display: flex; gap: calc(var(--u) * 24); justify-content: center; flex-wrap: wrap; margin-bottom: calc(var(--u) * 30); }
.bag-slot { width: calc(var(--u) * 170); height: calc(var(--u) * 170); border-radius: calc(var(--u) * 30); border: calc(var(--u) * 5) dashed rgba(138, 106, 78, .5); background: #f5ead2; display: flex; align-items: center; justify-content: center; }
.bag-slot img { width: 78%; height: 78%; object-fit: contain; }

/* 교사용 설정 (U10) */
.teacher { position: absolute; inset: 0; background: rgba(12, 14, 30, .82); display: flex; align-items: center; justify-content: center; padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px); }
.t-panel { width: min(100%, 980px); max-height: 100%; overflow-y: auto; background: #fbf6ea; border-radius: 22px; border: 3px solid #b39a78; color: #3a2e27; font-family: var(--f-body);
  padding: 18px 22px 22px; font-size: clamp(15px, calc(var(--u) * 30), 22px); -webkit-user-select: text; user-select: text; }
.t-panel h2 { margin: 0 0 4px; font-family: var(--f-title); font-weight: 400; font-size: 1.6em; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.t-panel .t-help { font-size: .82em; color: #6b5a4c; margin-bottom: 10px; font-weight: 400; }

.t-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.t-row label { display: inline-flex; align-items: center; gap: 6px; }
.t-btn { min-height: 44px; padding: 6px 16px; border-radius: 22px; border: 2px solid #b39a78; background: #fff; cursor: pointer; font-family: var(--f-body); font-size: 1em; color: #3a2e27; }
.t-btn.on { background: var(--star); border-color: #c98f14; }
.t-btn.warn { border-color: #c0573f; color: #9b3a24; }
.t-btn[disabled] { opacity: .45; cursor: default; }
.t-panel input[type=range] { width: min(320px, calc(var(--vw) * 60)); height: 32px; }
.t-note { font-size: .82em; color: #7a6a5c; font-weight: 400; }
.t-close { font-size: 1.05em; }

/* 세로 안내 (U11) */
#rotate { position: fixed; inset: 0; z-index: 50; background: var(--ink); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: var(--paper); font-family: var(--f-title); font-size: 30px; text-align: center; padding: 24px; }
#rotate.on { display: flex; }
#rotate svg { width: 140px; height: 140px; animation: rot 2.4s ease-in-out infinite; }
@keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

/* 움직임 줄이기 */
.reduce *, .reduce *::before, .reduce *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--cream); font-family: var(--f-title); font-size: 28px; background: var(--ink); }

/* 지도 위 인물 (발 위치가 기준점) */
.walker { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }   /* 10/4 폰 끊김: 걷는 사람마다 따로 움직여 지도를 다시 그리지 않게 */
.walker .sprite { left: -50px; top: -104px; image-rendering: pixelated; }   /* 9/30 지도 걷기 캐릭터를 선생님 픽셀 그림으로: 흐리게 번지지 않게 */
.walker .shadow { left: 0; top: 0; }
.walker .sigh { left: 14px; top: -58px; width: 30px; height: 20px; margin: -10px 0 0 0; transform-origin: 0 50%; }   /* 10/1 선생님: 머리 위 말풍선처럼 보여 입과 팔 사이로 */
.walker .sigh.l { left: -14px; margin-left: -30px; transform-origin: 100% 50%; }
.walker .sigh.on { animation: sighPuff 2.4s ease-out forwards; }
.walker .sigh.l.on { animation-name: sighPuffL; }
@keyframes sighPuff { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 25% { opacity: .85; } 100% { transform: translate(12px, -8px) scale(1); opacity: 0; } }
@keyframes sighPuffL { 0% { transform: translate(0, 0) scale(-.4, .4); opacity: 0; } 25% { opacity: .85; } 100% { transform: translate(-12px, -8px) scale(-1, 1); opacity: 0; } }
.whit { position: absolute; left: calc(-48px * var(--k, 1)); top: calc(-120px * var(--k, 1)); width: calc(96px * var(--k, 1)); height: calc(140px * var(--k, 1)); border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 30px; }
.whit:focus, .whit:focus-visible { outline: none; }
.wbubble { position: absolute; left: 0; bottom: 124px; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-body); font-size: calc(30px * var(--k, 1)); color: var(--brown);
  background: var(--paper); border: calc(3px * var(--k, 1)) solid rgba(138, 106, 78, .7); border-radius: calc(26px * var(--k, 1)); padding: calc(8px * var(--k, 1)) calc(22px * var(--k, 1)); box-shadow: 0 4px 10px rgba(0, 0, 0, .35); pointer-events: none; z-index: 5000; }
.wbubble::after { content: ''; position: absolute; left: 50%; bottom: calc(-16px * var(--k, 1)); margin-left: calc(-10px * var(--k, 1)); border: calc(10px * var(--k, 1)) solid transparent; border-top: calc(8px * var(--k, 1)) solid var(--paper); }
.map-color { transition: opacity .6s; }
.place:focus-visible { outline: 6px solid var(--star); }
/* 가벼운 모드: 겹치기 효과를 덜 씀 */
.light .lamp-glow { mix-blend-mode: normal; opacity: 0; }
.light .lamp-glow.on { opacity: .55; }
.light .sparkle, .light .twinkle { display: none; }
.hud-tl.keep { opacity: 1 !important; }
.placeholder { text-align: center; }
.placeholder .big { width: calc(var(--u) * 200); height: auto; display: block; margin: 0 auto; }
.placeholder p { font-family: var(--f-body); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); margin: calc(var(--u) * 10) 0 calc(var(--u) * 34); word-break: keep-all; }
.bag-name { text-align: center; min-height: calc(var(--u) * 60); font-family: var(--f-body); font-size: calc(var(--u) * 34 * var(--ts)); color: var(--brown); margin-bottom: calc(var(--u) * 20); }
.bag-slot { cursor: pointer; padding: 0; }

.cut .skipbox { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 24); z-index: 10; }

.cut .bigstar svg { width: 100%; height: 100%; filter: drop-shadow(0 0 16px rgba(255, 236, 170, .95)); }
.cut .cline { position: absolute; left: 0; top: 0; overflow: visible; }
.cut .cline path { fill: none; stroke: rgba(255, 236, 170, .5); stroke-width: 3; stroke-dasharray: 8 10; }
.cut .orb { position: absolute; width: calc(var(--u) * 90); height: calc(var(--u) * 90); margin: calc(var(--u) * -45) 0 0 calc(var(--u) * -45); border-radius: 50%;
  background: radial-gradient(circle, #fff 0 15%, #ffe9a8 32%, rgba(255, 214, 107, .45) 55%, rgba(255, 214, 107, 0) 72%); }
.cut .spk { position: absolute; width: calc(var(--u) * 46); height: calc(var(--u) * 46); margin: calc(var(--u) * -23) 0 0 calc(var(--u) * -23); }

#closeup { pointer-events: none; }
#closeup:empty, #teacher:empty, #dialog:empty { display: none; }
#teacher { pointer-events: none; z-index: 40; }

/* 휴대폰처럼 칸이 넓고 낮으면 번호와 이름을 옆으로 놓아 크게 */
.slots-grid.wide .slot-card { flex-direction: row; gap: calc(var(--cardH) * .12); }

/* ================= 프로토타입 2 (9/30): 아이템 카드, 퀘스트 알림, 알게 된 것, 점자책, 촉각 지도 퍼즐, 도착 연출 ================= */
.spk { position: absolute; width: calc(var(--u) * 46); height: calc(var(--u) * 46); margin: calc(var(--u) * -23) 0 0 calc(var(--u) * -23); pointer-events: none !important; }

/* 아이템 얻기 카드 */
.get .sheet, .info .sheet { text-align: center; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 16); min-width: min(calc(var(--vw) * 88), calc(var(--u) * 620)); }
.get-pic { width: calc(var(--u) * 260); height: calc(var(--u) * 260); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, rgba(255, 236, 170, .95) 0%, rgba(255, 214, 107, .45) 45%, rgba(255, 214, 107, 0) 70%); }

.get-fly { position: absolute; pointer-events: none !important; transform-origin: 50% 50%; z-index: 5; }

.modal .dlg-next.wait { opacity: .45; }
/* 퀘스트 알림 (위쪽 가운데) */
.quest-banner { position: absolute; left: 50%; top: calc(var(--sat) + var(--u) * 22); transform: translate(-50%, 0); pointer-events: none !important; text-align: center; white-space: nowrap;
  background: rgba(255, 248, 236, .97); border: calc(var(--u) * 5) solid var(--star); border-radius: calc(var(--u) * 40); padding: calc(var(--u) * 16) calc(var(--u) * 48);
  box-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .8), 0 calc(var(--u) * 10) calc(var(--u) * 30) rgba(0, 0, 0, .35); }
.quest-banner .qb1 { font-family: var(--f-title); font-size: calc(var(--u) * 34 * var(--ts)); color: #8a5a0a; }
.quest-banner .qb2 { font-family: var(--f-title); font-size: calc(var(--u) * 46 * var(--ts)); color: var(--brown); }
/* 알게 된 것 */
.info-head { font-family: var(--f-title); font-size: calc(var(--u) * 40 * var(--ts)); color: #8a5a0a; display: flex; align-items: center; gap: calc(var(--u) * 10); }
.info-body { font-family: var(--f-title); font-size: calc(var(--u) * 50 * var(--ts)); color: var(--brown); line-height: 1.3; margin-bottom: calc(var(--u) * 14); word-break: keep-all; }
/* 해솔의 점자책 한 쪽 (가까이 보기) */
.book-big { padding: calc(var(--u) * 26); border-radius: calc(var(--u) * 26); background: #2E4F6B; box-shadow: 0 calc(var(--u) * 24) calc(var(--u) * 60) rgba(0, 0, 0, .5); margin-bottom: calc(var(--dlgH) + var(--u) * 20); }

.p4-piece { position: absolute; left: 0; top: 0; transform-origin: 0 0; border: 0; padding: 0; background-repeat: no-repeat; box-shadow: 0 10px 18px rgba(0, 0, 0, .5); cursor: grab; z-index: 2; }

/* 반딧불 소리 자물쇠 */
.puzzle.p4-ff { background: radial-gradient(ellipse at 50% 55%, #1e3a2e 0%, #10241c 55%, #08130f 100%); }
.p4-bush { position: absolute; left: 300px; top: 230px; width: 600px; height: 600px; pointer-events: none; }

.p4-fly { position: absolute; width: 230px; height: 230px; margin: -115px 0 0 -115px; border: 0; padding: 0; background: radial-gradient(circle, rgba(255, 236, 140, .35), rgba(255, 236, 140, 0) 65%); border-radius: 50%; cursor: pointer; animation: bob 2.2s ease-in-out infinite; transition: transform .15s, filter .15s, opacity .8s; }
.p4-fly img { width: 70%; height: 70%; object-fit: contain; pointer-events: none; filter: brightness(.75); }
.p4-fly i { display: block; width: 40px; height: 40px; margin: auto; border-radius: 50%; background: #ffe680; }

/* 노란 길 깔기 */

/* 별가루 보너스 별자리 */

.p4-bline { fill: none; stroke: rgba(255, 230, 150, .9); stroke-width: 6; stroke-linejoin: round; filter: drop-shadow(0 0 10px rgba(255, 214, 107, .9)); }

/* 10/1 제 1장 앞 양피지 안으로 들어가기 (그림 parchment_open 1376x768, 빈 종이 가운데 자리에 제 1장 그림이 번짐) */

  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

/* 10/1 퍼즐 화면의 층(z-index)이 대화창 위로 새어 나가지 않게 (점자 자물쇠에서 대화창이 가려져 넘어가지 않던 문제) */
.puzzle { isolation: isolate; }
.p4-dust.pop { animation: none; }
.walker .wgift { position: absolute; left: -22px; top: -150px; width: 44px; height: 44px; pointer-events: none; animation: tw 2.2s ease-in-out infinite; }

/* 10/1 찢어진 지도 조각: 모양은 clip-path, 그림자·고른 표시는 drop-shadow (모양을 따라감) */
.p4-jslot.torn { border: 0; background: rgba(255, 244, 224, .16); }
.p4-jslot.torn.filled { background: transparent; }
.p4-piece.torn { background: transparent; box-shadow: none; outline: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .55)); }

.p4-piece.torn.sel, .p4-piece.torn.hint { outline: none; filter: drop-shadow(0 0 6px #ffd66b) drop-shadow(0 0 6px #ffd66b) drop-shadow(0 8px 10px rgba(0, 0, 0, .5)); }
.p4-piece.torn.placed { filter: none; }
.p4-pc { position: absolute; inset: 0; background-repeat: no-repeat; pointer-events: none; }
/* 10/1 가방 마을 지도(실제 지도 + 이름표)와 촌장님 쪽지 */
.item-pop-pic.item-map { position: relative; }
.item-map .im-tag { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: 1em; color: var(--brown); background: rgba(255, 248, 232, .94);
  border: calc(var(--u) * 3) solid #c9a27a; border-radius: 999px; padding: .05em .6em; white-space: nowrap; box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 8) rgba(0, 0, 0, .3); pointer-events: none; }
.item-pop-pic.item-note { width: min(calc(var(--vw) * 84), calc(var(--u) * 820), calc(var(--vh) * 100)); height: auto; }
.map-pop .item-pop-pic.art img { width: min(calc(var(--vw) * 84), calc((calc(var(--vh) * 94) - 230px) * 1.78), calc(var(--u) * 1500)); height: auto; max-height: none; max-width: none; }   /* 10/1 마을 지도는 크게 (이름표가 읽히게) */
@media (max-height: 520px) { .map-pop .get-desc { display: none; } .map-pop .item-pop-pic.art img { width: min(calc(var(--vw) * 84), calc((calc(var(--vh) * 94) - 150px) * 1.78)); } }
.item-note .p4-note { width: 100%; }

.mstar.p4-askq { z-index: 30; width: 76px; height: 76px; margin: -76px 0 0 -38px; animation: askBob 1.4s ease-in-out infinite; font-family: var(--f-title); font-size: 64px; color: #ffd66b; text-align: center; }

@keyframes askBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.p4-mapstar { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); animation: mapStar 3s ease-in-out infinite; }
@keyframes mapStar { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -56%) scale(1.06); } }
.p4-mapstar img, .p4-mapstar svg { width: 100%; height: 100%; object-fit: contain; }
.item-note .p4-note-head .ico { width: auto; height: 1.4em; }
/* 10/1 도서관 앞 안내 기둥 (마을 지도 시점 이동, 지도 표시) */
.p4-libview { position: absolute; inset: 0; overflow: hidden; background: #1d2340; z-index: 50; }

.p4-lv-pole, .p4-mpole { position: absolute; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .7)); }
.p4-libview .wavemark { z-index: 2; width: 44px; height: 44px; }
/* 10/1 밤하늘 보기 (가방 옆 단추) */
.modal.sky-view { background-color: #141832; background-size: cover; background-position: center; display: block; }
.sky-view .sky-count { position: absolute; left: 50%; top: calc(var(--sat) + var(--u) * 30); transform: translateX(-50%); }
.sky-view .sky-close { position: absolute; right: calc(var(--sar) + var(--u) * 30); top: calc(var(--sat) + var(--u) * 30); }
/* 10/1 별 축제 불꽃놀이 */
.fw-dot { position: absolute; width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; pointer-events: none; z-index: 40; }

/* 10/1 별 축제 알림 종이 (선생님 그림) */
.pz2-slots { position: relative; }
.pz2-paper { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; object-fit: contain; z-index: 2; pointer-events: none; transform-origin: 50% 0; animation: pz2-pin .8s ease-out backwards; transition: opacity .6s; }
.pz2-paper.off { opacity: 0; animation: none; }   /* 10/2: both 로 두면 애니메이션이 opacity 1을 붙잡아 사라지지 않았음 */
@keyframes pz2-pin { from { opacity: 0; transform: translateY(-12%) rotate(-4deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pz2-paper { animation: none; } }

/* 10/1 장소를 끝내면 가운데 큰 지도로 버튼 */
.hud-go { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; z-index: 5; }
.hud-go .pill { font-size: calc(var(--u) * 56 * var(--ts)); min-height: calc(var(--bu) * 130); padding: 0 calc(var(--u) * 64); animation: hud-go-in .5s ease-out both, hud-go-pulse 1.6s ease-in-out .5s infinite; }

@keyframes hud-go-pulse { 50% { box-shadow: 0 0 0 calc(var(--bu) * 10) rgba(255, 214, 107, .55), 0 calc(var(--bu) * 6) 0 rgba(29, 35, 64, .35); } }
@media (prefers-reduced-motion: reduce) { .hud-go .pill { animation: none; } }
#world { touch-action: none; }   /* 10/2 지도 끌기: 휴대폰에서 끄는 동안 브라우저가 가로채지 않게 */


/* ---- 10/2 제목 화면 「별의 스펙트럼」: 동화책 (title.js G.titleBook) ---- */
.title-screen.tb { overflow: hidden; background: #2a1f18; }

.tb-page[data-density="hard"] { background: transparent; }   /* 10/4: 표지 가장자리에 밝은 세로 선이 비치던 것 */
.tb-ctitle { position: absolute; left: 17%; width: 72%; top: 9%; height: 15%; background: linear-gradient(180deg, #FFF0B8 0%, #E9C46A 55%, #C9973A 100%);

/* 10/2 제목·글귀: 선생님 붓글씨 그림 (단색, 테두리 없음, 아래로 옅은 그림자만) */

  background: radial-gradient(ellipse 34% 52% at 50% 36%, rgba(16, 20, 52, .5), rgba(16, 20, 52, .22) 60%, transparent 100%); }
.title-screen.tb .tb-open, .title-screen.tb .t-start { position: absolute; left: 50%; bottom: calc(6% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320);
  min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); transition: opacity .6s, transform .15s; }
.title-screen.tb .tb-open:active, .title-screen.tb .t-start:active { transform: translateX(-50%) translateY(calc(var(--u) * 4)); }

.title-screen.tb .t-start { background: linear-gradient(rgba(255, 243, 200, .72), rgba(250, 232, 178, .72)), var(--paper, none) center / cover, #FBEBB8; border: calc(var(--u) * 5) solid #5A3A22; color: #4A3020;
  box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 6) rgba(60, 40, 20, .22); }   /* 10/4 선생님: 연한 버터색 종이, 짙은 갈색 테두리, 아래로 아주 약한 그림자 */

.puzzle.s2-box { background: linear-gradient(rgba(40, 28, 18, .45), rgba(40, 28, 18, .55)), var(--bg-s2rest, none) center / cover no-repeat, #5a3d28; }

/* 10/2 선생님: 저장 칸 = 제목 화면의 책 (save.js bookPick). 양피지 쪽 + 가운데 수채 그림 + 나눔손글씨 */
.slots-screen.bk-screen { background: linear-gradient(rgba(20, 12, 6, .25), rgba(20, 12, 6, .45)), var(--desk) center / cover no-repeat, #3b2617; }

.bk-area { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.bk-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.bk-book { position: absolute; left: 335px; top: 105px; width: 1250px; height: 805px; }
.bk-page { background: #f3e2c0; }
.bk-paper { position: absolute; inset: 0; background: center / 100% 100% no-repeat; }

.bk-ill { position: absolute; left: 30px; right: 30px; top: 60px; bottom: 150px; background: center / cover no-repeat; mix-blend-mode: multiply; opacity: .95; filter: saturate(.85);
  -webkit-mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); }
.bk-slot { position: absolute; inset: 30px; cursor: pointer; border-radius: 40px; transition: box-shadow .25s; }
.bk-slot .cap { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-family: 'NanumPen', var(--f-title); font-size: 76px; line-height: 1; color: #4a3220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bk-slot.picked { box-shadow: inset 0 0 0 10px rgba(240, 180, 40, .9), 0 0 60px rgba(255, 214, 107, .9); }
.bk-board { position: absolute; left: 293px; top: 69px; width: 1334px; height: 877px; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .5)); }
.bk-cv { position: absolute; top: 0; bottom: 0; width: 50%; background: center / cover no-repeat #3c3f86; border: 3px solid #23264f; box-shadow: inset 0 0 26px rgba(10, 10, 40, .55); }
.bk-cv.l { left: 0; border-radius: 18px 6px 6px 18px; transform: scaleX(-1); }
.bk-cv.r { right: 0; border-radius: 6px 18px 18px 6px; }
.bk-board::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 34px; margin-left: -17px; background: linear-gradient(90deg, rgba(15, 15, 45, 0), rgba(15, 15, 45, .55), rgba(15, 15, 45, 0)); }
.bk-book::before { content: ''; position: absolute; inset: 0; box-shadow: 0 2px 10px rgba(20, 15, 40, .55); pointer-events: none; }
/* 10/2 선생님: 휴대폰에서 책을 크게. 머리글은 작게, 버튼은 책 바깥 양옆과 아래 구석으로 */
.bk-screen .s-head { min-height: calc(var(--u) * 84); }
.bk-screen .s-head h2 { font-size: calc(var(--u) * 40 * var(--ts)); }
.bk-screen .s-head .pill.round { width: calc(var(--bu) * 76) !important; height: calc(var(--bu) * 76) !important; }
.bk-screen .rv-nav { position: absolute; inset: 0; padding: 0; pointer-events: none; }
.bk-screen .rv-nav > * { position: absolute; pointer-events: auto; }
.bk-screen .rv-nav .rv-back { left: calc(var(--sal) + var(--u) * 20); top: auto; bottom: calc(var(--sab) + var(--u) * 20); }
.bk-screen .rv-nav .rv-arrow { top: 59%; width: calc(var(--bu) * 104); height: calc(var(--bu) * 104); }
.bk-screen .rv-nav .rv-arrow.prev { left: calc(var(--sal) + var(--u) * 20); }
.bk-screen .rv-nav .rv-arrow:not(.prev) { right: calc(var(--sar) + var(--u) * 20); }
.bk-screen .rv-nav .rv-ok { right: calc(var(--sar) + var(--u) * 20); bottom: calc(var(--sab) + var(--u) * 20); }
/* 10/2 선생님: 휴대폰을 세로로 들면 게임 화면을 90도 돌려 가로처럼 보여 줌 (core.js G.layout). 안전 영역도 돌려서 맞춤 */
html.rot90 { --sal: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-left, 0px); }
html.rot90 #game { transform-origin: 0 0; }
/* 10/3 선생님: [이어 하기] 번호 고르기의 저장 지우기 버튼(오른쪽 위)과 한 번 더 묻는 창 */
.bk-screen .rv-nav .rv-del { right: calc(var(--sar) + var(--u) * 20); top: calc(var(--sat) + var(--u) * 20); }
.pill.warn { background: #fde9e2; color: #9b3a24; border-color: #c0573f; }
.del-ask { text-align: center; }
.del-ask p { margin: 0 0 calc(var(--u) * 24); font-size: calc(var(--u) * 32); color: var(--brown); }
.del-ask .btn-row { display: flex; justify-content: center; gap: calc(var(--u) * 24); }


.s3-drawcol { filter: saturate(1.35) brightness(1.12); pointer-events: none; }   /* 10/4 하랑이 그림만 색 */
/* 10/4 놀던 중 다시 켜졌을 때 바로 이어 하기 */
.quick-resume { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 34); background: radial-gradient(circle at 50% 40%, #2c2a4a, #14132a); z-index: 50; }
.quick-resume .qr-msg { font-size: calc(var(--u) * 46); color: #FFF4E0; }
.quick-resume .qr-go { font-size: calc(var(--u) * 54); padding: calc(var(--u) * 22) calc(var(--u) * 60); }
.quick-resume .qr-title { opacity: .75; }
/* 10/4 선생님: 다른 화면에 갔다 오면 소리가 꺼짐 → 누르면 다시 켜는 판 */
.snd-wake { position: fixed; inset: 0; z-index: 99990; border: 0; padding: 0; margin: 0; background: rgba(20, 22, 48, .55); display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: var(--f-body, inherit); }
.snd-wake span { background: var(--paper, #FFF4E0); color: var(--brown, #4A3B32); border: 4px solid #5A3A22; border-radius: 28px; padding: 22px 36px; font-size: clamp(20px, 3.2vw, 40px); line-height: 1.5; text-align: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }

/* 10/6 별 올리기 별가루 꼬리 (core.js G.riseTrail) */
.rtrail { position: absolute; inset: 0; pointer-events: none; z-index: 4; overflow: visible; }
.rtrail-g { position: absolute; pointer-events: none; opacity: 0; filter: blur(1px) brightness(1.3); }
.rtrail-g svg, .rtrail-g img { width: 100%; height: 100%; display: block; object-fit: contain; }
.rtrail-s { position: absolute; pointer-events: none; }
.rtrail-s svg, .rtrail-s img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 8px var(--c, #FFD66B)) drop-shadow(0 0 3px #fff); }
.rtrail-glow { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, #FFFDF2 0 18%, var(--c, #FFD66B) 42%, transparent 70%); }
.rtrail-ring { position: absolute; pointer-events: none; border-radius: 50%; border: 6px solid #FFFDF2; box-shadow: 0 0 18px var(--c, #FFD66B), inset 0 0 18px var(--c, #FFD66B); }
.rtrail-d { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, #fff 0 30%, var(--c, #FFD66B) 55%, transparent 72%); }

/* 10/6 표지 오른쪽 아래 최종 수정 일시 (개발자 확인용) */
.title-screen.tb .tb-ver { position: absolute; right: calc(var(--u) * 18 + var(--sar, 0px)); bottom: calc(var(--u) * 12 + var(--sab)); font-size: calc(var(--u) * 18); color: rgba(255, 244, 224, .6); pointer-events: none; z-index: 5; transition: opacity .4s; }
.tb.open .tb-ver { opacity: 0; }
