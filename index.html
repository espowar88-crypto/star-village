@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Light.otf) format('opentype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(fonts/MaruBuri-Bold.otf) format('opentype');font-weight:700;font-style:normal;font-display:swap}
/* 별이 사라진 마을 — 화면 모양 (기획안 16장: 밤 동화책, 크림색 종이, 별빛 노랑) */
:root {
  --u: 1px; --bu: 1px;   /* --bu: 버튼 크기 단위 (휴대폰에서는 손가락 크기 약 11mm를 위해 --u보다 큼) */
                  /* 화면 크기에 맞춘 단위 (1920x1080 기준 1px). main.js가 계속 바꿈 */
  --ts: 1;                  /* 글자 크기 배율 (교사용 설정: 크게 = 1.2) */
  --navy: #2E3A6B; --violet: #5B5A8F; --paper: #FFF8EC; --cream: #FFF4E0; --star: #FFD66B; --lamp: #F4A259;
  --brown: #4A3B32; --wood: #8A6A4E; --ink: #1D2340; --green: #3F7D5A; --sky: #7DBBE3;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --vw: 1vw; --vh: 1vh;
  --f-title: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;   /* 글꼴은 배민 주아체 하나 (9/29 선생님 요청) */
  --f-body: 'BMJUA', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --dlgH: max(calc(var(--u) * 170), calc(var(--bu) * 100 + var(--u) * 56));   /* 대화창 높이 (9/29 줄임) */
  color-scheme: dark;
}
html { font-synthesis: none; }   /* 주아체는 굵기가 하나: 가짜 굵게 만들지 않음 */
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ink); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: var(--f-body); color: var(--brown); }
#game { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#game * { box-sizing: border-box; }
/* 9/30: claude.ai 미리보기 문서 틀의 img{max-width:100%} 때문에 밤하늘·지도·인물 그림이 부모 폭으로 줄어들던 것 막기 (점수가 가장 낮아 다른 규칙은 그대로) */
:where(#game) img { max-width: none; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus { outline: none; }
button:focus-visible { outline: calc(var(--u) * 6) solid var(--star); outline-offset: calc(var(--u) * 4); }
img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

/* 층 */
.layer { position: absolute; inset: 0; }
#world { overflow: hidden; }
#hud, #dialog, #overlay, #toast { pointer-events: none; }
#hud > *, #dialog > *, #overlay > * { pointer-events: auto; }
#overlay:empty { display: none; }
#fade { background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; }
#fade.on { opacity: 1; pointer-events: auto; }

/* 공통 버튼 (통통한 알약 + 수채 바탕) */
.pill { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 12);
  min-height: calc(var(--bu) * 100); min-width: calc(var(--bu) * 100); padding: 0 calc(var(--u) * 34);
  border: calc(var(--u) * 4) solid rgba(74, 59, 50, .55); border-radius: calc(var(--u) * 60);
  background: radial-gradient(ellipse at 30% 25%, #fffdf6 0%, var(--cream) 45%, #f1dfbf 100%);
  box-shadow: 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .35), inset 0 0 calc(var(--u) * 18) rgba(214, 170, 110, .35);
  font-family: var(--f-title); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); cursor: pointer; line-height: 1; }
.pill.gold { background: radial-gradient(ellipse at 30% 25%, #fff6cf 0%, var(--star) 50%, #f0b64a 100%); }
.pill:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 2) 0 rgba(29, 35, 64, .35); }
.pill .ico, .ico { height: 1.4em; width: auto; flex: none; vertical-align: middle; }
.pill[disabled] { opacity: .45; cursor: default; }
.pill.round { width: calc(var(--bu) * 130); height: calc(var(--bu) * 130); padding: 0; border-radius: 50%; }

/* 타이틀 */
.title-screen { position: absolute; inset: 0; background: #232a4f center / cover no-repeat; }
.title-screen .t-main { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.title-screen h1 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 150); color: var(--paper);
  text-shadow: 0 0 calc(var(--u) * 30) rgba(255, 214, 107, .7), 0 calc(var(--u) * 6) 0 rgba(29, 35, 64, .6); letter-spacing: .02em; }
.title-screen .t-sub { font-family: var(--f-title); font-size: calc(var(--u) * 54); color: var(--star); margin-top: calc(var(--u) * 10); text-shadow: 0 calc(var(--u) * 4) 0 rgba(29, 35, 64, .6); }
.title-screen .t-lumi { position: absolute; width: calc(var(--u) * 190); left: calc(50% + var(--u) * 470); top: calc(12% + var(--u) * 10); animation: float 3.2s ease-in-out infinite; }
.title-screen .t-start { position: absolute; left: 50%; bottom: calc(18% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320); min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); }
.title-screen .t-note { position: absolute; left: 50%; bottom: calc(8% + var(--sab)); transform: translateX(-50%); width: 90%; text-align: center; font-size: calc(var(--u) * 30); color: var(--cream); text-shadow: 0 1px 3px #000; }
.title-screen .t-ver { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 18); font-size: calc(var(--u) * 24); color: rgba(255, 244, 224, .75); text-align: right; line-height: 1.5; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(calc(var(--u) * -22)) rotate(4deg); } }

/* 저장 칸: 번호 칸 (9/29 그림 고르기 뺌) */
.slots-screen { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #3d4a86 0%, #2a3160 60%, #1f2548 100%); display: flex; flex-direction: column;
  padding: calc(var(--sat) + var(--u) * 24) calc(var(--sar) + var(--u) * 40) calc(var(--sab) + var(--u) * 24) calc(var(--sal) + var(--u) * 40); }

.slots-screen .s-head h2 { margin: 0; font-family: var(--f-title); font-weight: 400; color: var(--paper); font-size: calc(var(--u) * 48 * var(--ts)); }
.slots-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: var(--cardH, calc(var(--u) * 220)); gap: calc(var(--u) * 22); overflow-y: auto; padding: calc(var(--u) * 8); min-height: 0; }
.slot-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 4);
  border: calc(var(--u) * 4) solid rgba(74, 59, 50, .5); border-radius: calc(var(--u) * 36); background: radial-gradient(ellipse at 30% 25%, #fffdf6, var(--cream) 50%, #f0dcb8);
  box-shadow: 0 calc(var(--u) * 6) 0 rgba(0, 0, 0, .3); cursor: pointer; padding: calc(var(--u) * 6); overflow: hidden; }
.slot-card .bn { font-family: var(--f-title); font-size: calc(var(--cardH, calc(var(--u) * 220)) * .40); line-height: 1; color: var(--navy); }
.slot-card.empty .bn { color: rgba(74, 59, 50, .55); }
.slot-card .nm { font-family: var(--f-title); font-size: calc(var(--cardH, calc(var(--u) * 220)) * .14); color: var(--brown); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-card .meta { position: absolute; top: calc(var(--u) * 10); right: calc(var(--u) * 14); display: flex; align-items: center; gap: .15em; font-family: var(--f-title); font-size: calc(var(--cardH, calc(var(--u) * 220)) * .12); color: #9a6a12; }
.slot-card .meta .ico { height: 1.2em; }
.slot-card .pl { position: absolute; top: calc(var(--u) * 8); left: calc(var(--u) * 10); width: calc(var(--cardH, calc(var(--u) * 220)) * .24); height: auto; }
.slot-card.empty { background: radial-gradient(ellipse at 30% 25%, #fbf6ea, #efe5d0 60%, #dccfb4); }
.slot-card.picked { outline: calc(var(--u) * 8) solid var(--star); }

/* 9/30 시작: 새로 하기 / 이어 하기 → 번호 카드가 빙글 돌아가는 고르기 */
.mode-row { flex: 1; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 70); min-height: 0; }
.mode-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 14); width: min(calc(var(--vw) * 40), calc(var(--u) * 640)); height: min(calc(var(--vh) * 62), calc(var(--u) * 600));
  border: calc(var(--u) * 5) solid rgba(74, 59, 50, .5); border-radius: calc(var(--u) * 48); background: radial-gradient(ellipse at 30% 25%, #fffdf6, var(--cream) 50%, #f0dcb8);
  box-shadow: 0 calc(var(--u) * 10) 0 rgba(0, 0, 0, .3); cursor: pointer; font-family: var(--f-title); color: var(--brown); transition: transform .15s; }
.mode-card:active { transform: translateY(calc(var(--u) * 6)); }
.mode-card .mc-ico .ico { width: min(calc(var(--vh) * 18), calc(var(--u) * 170)); height: auto; }
.mode-card .mc-label { font-size: min(calc(var(--vh) * 9), calc(var(--u) * 84)); color: var(--navy); line-height: 1.1; }
.mode-card .mc-sub { font-size: min(calc(var(--vh) * 4.6), calc(var(--u) * 38)); }
.mode-card.off { opacity: .5; cursor: default; filter: grayscale(.6); }
.rv-stage { position: relative; flex: 1; min-height: 0; perspective: calc(var(--u) * 1600); overflow: hidden; touch-action: pan-y; }
.rv-ring { position: absolute; inset: 0; transform-style: preserve-3d; }
.rv-card { position: absolute; left: 50%; top: 50%; width: min(calc(var(--vw) * 34), calc(var(--u) * 600), calc(var(--vh) * 60)); aspect-ratio: 4 / 3.4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 6);
  --cardH: min(calc(var(--vw) * 34), calc(var(--u) * 600), calc(var(--vh) * 60));
  border: calc(var(--u) * 5) solid rgba(74, 59, 50, .5); border-radius: calc(var(--u) * 44); background: radial-gradient(ellipse at 30% 25%, #fffdf6, var(--cream) 50%, #f0dcb8);
  box-shadow: 0 calc(var(--u) * 10) calc(var(--u) * 30) rgba(0, 0, 0, .35); cursor: pointer; transition: transform .45s cubic-bezier(.3, .9, .3, 1), opacity .45s; overflow: hidden; }
.rv-card.empty { background: radial-gradient(ellipse at 30% 25%, #fbf6ea, #efe5d0 60%, #dccfb4); }
.rv-card.front { border-color: var(--star); box-shadow: 0 0 0 calc(var(--u) * 6) rgba(255, 214, 107, .55), 0 calc(var(--u) * 14) calc(var(--u) * 40) rgba(0, 0, 0, .45); }
.rv-card .bn { font-family: var(--f-title); font-size: calc(var(--cardH) * .42); line-height: 1; color: var(--navy); }
.rv-card.empty .bn { color: rgba(74, 59, 50, .6); }
.rv-card .nm { font-family: var(--f-title); font-size: calc(var(--cardH) * .12); color: var(--brown); max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-card .meta { position: absolute; top: calc(var(--cardH) * .05); right: calc(var(--cardH) * .07); display: flex; align-items: center; gap: .15em; font-family: var(--f-title); font-size: calc(var(--cardH) * .1); color: #9a6a12; }
.rv-card .meta .ico { height: 1.2em; }
.rv-card .pl { position: absolute; top: calc(var(--cardH) * .04); left: calc(var(--cardH) * .05); width: calc(var(--cardH) * .22); height: auto; }
.rv-card.picked { outline: calc(var(--u) * 8) solid var(--star); }
.rv-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--f-title); font-size: calc(var(--u) * 46); color: var(--paper); text-align: center; }
.rv-nav { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 28); padding-top: calc(var(--u) * 10); }
.rv-nav .rv-back { position: absolute; left: calc(var(--sal) + var(--u) * 40); }
.rv-nav .rv-arrow { width: calc(var(--bu) * 120); height: calc(var(--bu) * 120); min-width: 0; min-height: 0; padding: 0; }
.rv-nav .rv-arrow .ico { width: 60%; height: 60%; }
.rv-nav .rv-arrow.prev .ico { transform: scaleX(-1); }
.reduce .rv-card { transition: opacity .2s; }
/* 10/1 선생님: 저장 칸을 양피지로 (그림 parchment_card), 넘길 때 앞장이 넘어감 */
.rv-screen.parch .rv-card { aspect-ratio: 600 / 456; border: none; border-radius: 0; background: var(--parch) center / 100% 100% no-repeat; box-shadow: none; overflow: visible;
  filter: drop-shadow(0 calc(var(--u) * 10) calc(var(--u) * 16) rgba(0, 0, 0, .45)); }
.rv-screen.parch .rv-card.empty { background: var(--parch) center / 100% 100% no-repeat; }
.rv-screen.parch .rv-card.empty .bn { color: rgba(110, 80, 50, .55); }
.rv-screen.parch .rv-card.front { box-shadow: none; filter: drop-shadow(0 0 calc(var(--u) * 14) rgba(255, 214, 107, .8)) drop-shadow(0 calc(var(--u) * 12) calc(var(--u) * 20) rgba(0, 0, 0, .45)); }
.rv-screen.parch .rv-card.picked { outline: none; filter: drop-shadow(0 0 calc(var(--u) * 26) rgba(255, 214, 107, 1)); }
.rv-screen.parch .rv-card .meta { top: calc(var(--cardH) * .1); right: calc(var(--cardH) * .2); }
.rv-screen.parch .rv-card .pl { top: calc(var(--cardH) * .08); left: calc(var(--cardH) * .1); }
/* 10/2 선생님: 책장 넘기기 (save.js leaf) */
.rv-flip { position: absolute; left: 50%; top: 50%; transform-origin: 0 50%; transform-style: preserve-3d; pointer-events: none; z-index: 5; }
.rv-flip .rv-face { position: absolute; inset: 0; width: 100%; height: 100%; transform: none; opacity: 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.rv-flip .rv-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(40, 25, 10, .15), rgba(40, 25, 10, .7)); opacity: 0; pointer-events: none; -webkit-mask: var(--parch) center / 100% 100% no-repeat; mask: var(--parch) center / 100% 100% no-repeat; }
.rv-flip .rv-back { position: absolute; inset: 0; background: var(--parch, #f3e3c3) center / 100% 100% no-repeat; transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: brightness(.82) drop-shadow(0 calc(var(--u) * 10) calc(var(--u) * 16) rgba(0, 0, 0, .4)); }

/* 이름 쓰기 */
.modal { position: absolute; inset: 0; background: rgba(20, 24, 48, .72); display: flex; align-items: center; justify-content: center; padding: calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px); }
.sheet { background: var(--paper); border-radius: calc(var(--u) * 40); border: calc(var(--u) * 5) solid rgba(138, 106, 78, .6); box-shadow: 0 0 0 calc(var(--u) * 10) rgba(255, 214, 107, .18), 0 calc(var(--u) * 20) calc(var(--u) * 60) rgba(0, 0, 0, .5);
  padding: calc(var(--u) * 44) calc(var(--u) * 56); max-width: min(calc(var(--vw) * 92), calc(var(--u) * 1200)); max-height: 100%; overflow: auto; }
.sheet h3 { margin: 0 0 calc(var(--u) * 26); font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 42 * var(--ts)); color: var(--brown); text-align: center; }
.name-row { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 30); }
.name-row input { font-family: var(--f-title); font-size: calc(var(--u) * 50); width: min(calc(var(--vw) * 80), calc(var(--u) * 700)); padding: calc(var(--u) * 14) calc(var(--u) * 28); border-radius: calc(var(--u) * 26);
  border: calc(var(--u) * 5) solid var(--wood); background: #fff; color: var(--brown); text-align: center; -webkit-user-select: text; user-select: text; }
.btn-row { display: flex; gap: calc(var(--u) * 30); justify-content: center; flex-wrap: wrap; }

/* 지도·장면 공통 세계 */
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world img.bg { position: absolute; left: 0; top: 0; display: block; }
.map-color { -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
.lamp-glow { position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255, 246, 214, 1) 0 5%, rgba(255, 214, 120, .65) 14%, rgba(244, 162, 89, .25) 38%, rgba(244, 162, 89, 0) 68%); opacity: 0; transition: opacity 1.2s ease; }
.lamp-glow.on { opacity: 1; }
.shadow { position: absolute; width: 56px; height: 20px; margin: -10px 0 0 -28px; border-radius: 50%; background: radial-gradient(ellipse, rgba(24, 20, 44, .55), rgba(24, 20, 44, 0) 70%); pointer-events: none; }
.sprite { position: absolute; width: 100px; height: 130px; background-repeat: no-repeat; background-size: 900px 520px; pointer-events: none; }
.walker-hit { position: absolute; border: 0; background: transparent; padding: 0; cursor: pointer; }
.lumi-f { position: absolute; left: 0; top: 0; width: calc(90px * var(--k, 1)); height: calc(90px * var(--k, 1)); margin: calc(-45px * var(--k, 1)) 0 0 calc(-45px * var(--k, 1)); pointer-events: none; z-index: 2999; }
.lumi-f img { width: 100%; height: 100%; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.sigh { position: absolute; width: 40px; height: 26px; margin: -13px 0 0 -20px; opacity: 0; transition: opacity .8s; pointer-events: none; }
.sigh.on { opacity: .85; }

/* 장소 표시 (지도) */
.place { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 40px; }
.marker { position: absolute; width: calc(120px * var(--k, 1)); height: calc(120px * var(--k, 1)); margin: calc(-60px * var(--k, 1)) 0 0 calc(-60px * var(--k, 1)); pointer-events: none; transition: transform .4s; z-index: 3000; }
.marker svg { width: 100%; height: 100%; overflow: visible; }
.marker.open svg { animation: breathe 2s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); }
.marker.locked { opacity: .6; }
.marker.done svg { filter: drop-shadow(0 0 6px rgba(255, 214, 107, .6)); }
@keyframes breathe { 0%, 100% { transform: scale(.9); opacity: .78; } 50% { transform: scale(1.08); opacity: 1; } }
.plabel { position: absolute; transform: translate(-50%, 0); white-space: nowrap; font-family: var(--f-title); font-size: calc(38px * var(--k, 1)); color: var(--brown); z-index: 3001;
  background: rgba(255, 248, 236, .94); border: 4px solid rgba(138, 106, 78, .6); border-radius: 40px; padding: 6px 26px 4px; pointer-events: none; box-shadow: 0 4px 0 rgba(0, 0, 0, .25); }
.plabel.locked { background: rgba(200, 200, 215, .8); color: #555a70; }
.trail { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.trail path { fill: none; stroke: var(--star); stroke-width: 16; stroke-linecap: round; stroke-dasharray: 2 34; filter: drop-shadow(0 0 10px rgba(255, 214, 107, .9)); animation: dash 1.2s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -36; } }
.arrow { position: absolute; width: 90px; height: 110px; margin: -110px 0 0 -45px; pointer-events: none; animation: arrowb 1.4s ease-in-out infinite; }
@keyframes arrowb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-24px); } }
.bloom-ring { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse, rgba(255, 214, 107, 0) 55%, rgba(255, 214, 107, .75) 68%, rgba(255, 214, 107, 0) 80%); }

/* 장면 */
.hot-glow { position: absolute; pointer-events: none; opacity: .4; animation: glowb 2s ease-in-out infinite; }
.hot-glow.strong { animation: glows 1s ease-in-out infinite; }
.hot-glow.seen { display: none; }
@keyframes glowb { 0%, 100% { opacity: .28; } 50% { opacity: .9; } }
@keyframes glows { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
.hot { position: absolute; border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 30px; }
.hot:focus, .hot:focus-visible { outline: none; }
.mstar { position: absolute; width: 64px; height: 64px; margin: -64px 0 0 -32px; pointer-events: none; }
.mstar svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .9)); }
.scene-sprite { position: absolute; pointer-events: none; transition: filter .3s; }
.scene-sprite.idle { animation: idleb 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
.scene-sprite.talking { filter: brightness(1.12) drop-shadow(0 0 12px rgba(255, 214, 107, .85)); }
@keyframes idleb { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.015); } }
.sparkle { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; pointer-events: none; }

/* HUD */
.hud-tl { position: absolute; left: calc(var(--sal) + var(--u) * 24); top: calc(var(--sat) + var(--u) * 22); display: flex; flex-direction: column; gap: calc(var(--u) * 10); max-width: calc(100% - var(--u) * 420); }
.quest { border: calc(var(--u) * 4) solid rgba(138, 106, 78, .55); border-radius: calc(var(--u) * 34); background: rgba(255, 248, 236, .93); padding: calc(var(--u) * 12) calc(var(--u) * 30); text-align: left; cursor: pointer;
  box-shadow: 0 calc(var(--u) * 5) 0 rgba(0, 0, 0, .25); min-height: calc(var(--bu) * 100); }
.quest .q1 { font-family: var(--f-title); font-size: calc(var(--u) * 34 * var(--ts)); color: #8a5a0a; line-height: 1.15; }
.quest .q2 { font-family: var(--f-body); font-size: calc(var(--u) * 29 * var(--ts)); color: var(--brown); line-height: 1.3; }
.tasks { font-family: var(--f-title); font-size: calc(var(--u) * 36 * var(--ts)); color: var(--brown); display: flex; align-items: center; gap: calc(var(--u) * 14); }
.tasks .stars { display: inline-flex; gap: .18em; vertical-align: middle; }
.tasks .stars svg, .tasks .stars img.art { width: 1.15em; height: 1.15em; display: block; flex: none; }   /* 9/30: 할 일 표시는 동그라미 */
.tasks .stars b { color: #e6a817; text-shadow: 0 0 calc(var(--u) * 10) rgba(255, 214, 107, .9); }
.flash { animation: flash 1s ease-in-out 3; }
@keyframes flash { 50% { box-shadow: 0 0 0 calc(var(--u) * 12) rgba(255, 214, 107, .8); } }
.hud-tr { position: absolute; right: calc(var(--sar) + var(--u) * 24); top: calc(var(--sat) + var(--u) * 22); display: flex; gap: calc(var(--u) * 16); }
.hud-bl { position: absolute; left: calc(var(--sal) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 24); }
.hud-br { position: absolute; right: calc(var(--sar) + var(--u) * 24); bottom: calc(var(--sab) + var(--u) * 24); }
.lumi-btn { width: calc(var(--bu) * 150); height: calc(var(--bu) * 150); border-radius: 50%; border: calc(var(--u) * 4) solid rgba(255, 214, 107, .8); background: radial-gradient(circle, rgba(255, 236, 170, .35), rgba(46, 58, 107, .75) 70%); padding: 0; cursor: pointer; position: relative; }
.lumi-btn img { width: 115%; height: 115%; margin: -7.5%; animation: bob 2.4s ease-in-out infinite; }
.lumi-btn span { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * -8); font-family: var(--f-title); font-size: calc(var(--u) * 28); color: var(--paper); text-shadow: 0 1px 3px #000; }
.bubble { position: absolute; left: calc(var(--sal) + var(--u) * 190); bottom: calc(var(--sab) + var(--u) * 60); max-width: min(calc(var(--vw) * 70), calc(var(--u) * 1100)); background: var(--paper); border-radius: calc(var(--u) * 34);
  border: calc(var(--u) * 4) solid rgba(255, 214, 107, .9); padding: calc(var(--u) * 16) calc(var(--u) * 32); font-size: calc(var(--u) * 34 * var(--ts)); color: var(--brown); box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 16) rgba(0, 0, 0, .35); pointer-events: none; }
.bubble::before { content: ''; position: absolute; left: calc(var(--u) * -26); bottom: calc(var(--u) * 30); border: calc(var(--u) * 14) solid transparent; border-right: calc(var(--u) * 18) solid rgba(255, 214, 107, .9); }
.saved { position: absolute; right: calc(var(--sar) + var(--u) * 30); top: calc(var(--sat) + var(--u) * 140); width: calc(var(--u) * 54); height: calc(var(--u) * 54); opacity: 0; }
.saved.blink { animation: saved 1.4s ease; }
@keyframes saved { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1); } }

/* 대화 (U5) */
.dlg-wrap { position: absolute; inset: 0; }
.dlg-hit { position: absolute; inset: 0; }
/* 인물 그림 (9/29 밤): 상반신 위주로 크게, 허리 아래는 대화창 뒤로(그림 아래 끝은 화면 아래 끝). 서로 마주 보게 왼쪽 25%·오른쪽 75% 둘레에 섬
   층 순서 규칙: 장면 < 인물 그림(#portraits) < 할 일 표시·버튼(#hud) < 가까이 보기 < 대화창·선택지(#dialog) < 창·교사용
   인물 그림은 누를 수 없고 어떤 버튼도 가리지 않음. 새 버튼은 #hud·#dialog·#overlay에 넣으면 저절로 그림 위에 옴 */
#portraits { pointer-events: none; transition: background .3s;
  --ph: min(calc(var(--u) * 860), calc(100% - var(--sat) - 11%), calc(var(--vw) * 45), calc((100% - var(--sat) - 4% - var(--dlgTopB)) / 0.74));   /* 그림 높이: 화면 폭의 45%를 넘지 않게 (두 인물이 겹치지 않게). 9/30: 들어 올려도 인물과 머리 뒤 루미(-8%) 위가 잘리지 않게 */
  --dlgTopB: calc(var(--sab) + var(--u) * 24 + var(--dlgH)); }   /* 대화창 위 끝의 화면 아래로부터 높이 */
#portraits * { pointer-events: none; }
#portraits.on { background: rgba(20, 24, 48, .18); }
#portraits.look { background: transparent; }   /* "눌러 봐" 대사: 그림이 아래로 비켜서 누를 곳이 다 보임 */
#portraits.look .pgroup { opacity: 0; transform: translateX(-50%) translateY(calc(var(--u) * 40)); }
#portraits:empty { display: none; }
.pgroup { position: absolute; bottom: 0; height: var(--ph); width: max-content; transform: translateX(-50%); transition: opacity .3s, transform .3s; display: flex; align-items: flex-end; }   /* 9/29 밤: 폭을 그림 폭 그대로 (오른쪽 무리가 화면 끝에 눌려 가로로 줄어들던 문제) */
.pgroup.L { left: calc(var(--sal) + 25%); }
.pgroup.R { left: calc(75% - var(--sar)); }

.p4-piece.sel, .p4-piece.hint { outline: 8px solid rgba(255, 214, 107, .95); }
.p4-piece.placed { box-shadow: none; z-index: 1; cursor: default; }
/* 반딧불 소리 자물쇠 */
.puzzle.p4-ff { background: radial-gradient(ellipse at 50% 55%, #1e3a2e 0%, #10241c 55%, #08130f 100%); }
.p4-bush { position: absolute; left: 300px; top: 230px; width: 600px; height: 600px; pointer-events: none; }
.p4-bush img { width: 100%; height: 100%; object-fit: contain; }
.p4-bush.open { opacity: 0; }
.p4-fly { position: absolute; width: 230px; height: 230px; margin: -115px 0 0 -115px; border: 0; padding: 0; background: radial-gradient(circle, rgba(255, 236, 140, .35), rgba(255, 236, 140, 0) 65%); border-radius: 50%; cursor: pointer; animation: bob 2.2s ease-in-out infinite; transition: transform .15s, filter .15s, opacity .8s; }
.p4-fly img { width: 70%; height: 70%; object-fit: contain; pointer-events: none; filter: brightness(.75); }
.p4-fly i { display: block; width: 40px; height: 40px; margin: auto; border-radius: 50%; background: #ffe680; }
.p4-fly.lit { filter: drop-shadow(0 0 30px #ffe680) brightness(1.6); transform: scale(1.35); }
.p4-fly.lit img { filter: brightness(1.3); }
.p4-fly.hint { animation: thint 1.6s ease-in-out infinite; }
.p4-fly.away { opacity: 0; }
/* 노란 길 깔기 */
.p4-tboard { background: #8d8f9e; border-radius: 26px; box-shadow: inset 0 0 0 10px rgba(255, 255, 255, .08), 0 30px 60px rgba(0, 0, 0, .5);
  background-image: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, .08) 2px, transparent 3px); background-size: 60px 60px; }
.p4-tcell { position: absolute; box-sizing: border-box; border: 6px dashed rgba(255, 244, 224, .8); border-radius: 14px; background: rgba(40, 44, 70, .25); padding: 6px; cursor: pointer; }
.p4-tcell.has { border-style: solid; border-color: rgba(255, 214, 0, .5); }
.p4-tcell img { width: 100%; height: 100%; display: block; transition: transform .25s; pointer-events: none; }
.p4-tcell.turn { border-color: #ffd400; animation: thint 1.6s ease-in-out infinite; }
.p4-tcell.hint { animation: thint 1.6s ease-in-out infinite; }
.p4-tcell.lit { box-shadow: 0 0 40px rgba(255, 214, 0, .95); }
.p4-tmark { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--f-title); font-size: 34px; color: #FFF4E0; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); white-space: nowrap; }
.p4-tmark img { width: 110px; height: 110px; object-fit: contain; }
.p4-tmark.door { flex-direction: row; }
.p4-tpal { position: absolute; display: flex; flex-direction: column; gap: 40px; }
.p4-tblock { width: 240px; height: 270px; border-radius: 26px; border: 6px solid #e0b96a; background: #FFF4E0; padding: 14px; cursor: grab; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--f-title); font-size: 38px; color: var(--brown); }
.p4-tblock img { width: 170px; height: 170px; object-fit: contain; pointer-events: none; }
.p4-tblock.sel, .p4-tblock.hint { animation: thint 1.6s ease-in-out infinite; border-color: #ffd400; }
/* 별가루 보너스 별자리 */
.p4-bonus { position: absolute; inset: 0; background: rgba(10, 12, 32, .6); pointer-events: none; }
.p4-bbox { position: absolute; left: 50%; top: 46%; width: min(calc(var(--vw) * 70), calc(var(--vh) * 70)); height: min(calc(var(--vw) * 70), calc(var(--vh) * 70)); transform: translate(-50%, -50%); }
.p4-bonus svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.p4-bline { fill: none; stroke: rgba(255, 230, 150, .9); stroke-width: 6; stroke-linejoin: round; filter: drop-shadow(0 0 10px rgba(255, 214, 107, .9)); }
.p4-bstar { position: absolute; width: 12%; height: 12%; transform: translate(-50%, -50%); }
.p4-bstar img, .p4-bstar svg { position: static; width: 100%; height: 100%; }

/* 10/1 제 1장 앞 양피지 안으로 들어가기 (그림 parchment_open 1376x768, 빈 종이 가운데 자리에 제 1장 그림이 번짐) */
.cut.parch-in { background: #1d2340; }
.pi-cam { position: absolute; inset: 0; transform-origin: 50% 49%; }
.pi-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.pi-win { position: absolute; left: 25%; top: 15%; width: 50%; height: 70%; background-size: cover; background-position: center;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

/* 10/1 퍼즐 화면의 층(z-index)이 대화창 위로 새어 나가지 않게 (점자 자물쇠에서 대화창이 가려져 넘어가지 않던 문제) */
.puzzle { isolation: isolate; }
.p4-dust.pop { animation: none; }
.walker .wgift { position: absolute; left: -22px; top: -150px; width: 44px; height: 44px; pointer-events: none; animation: tw 2.2s ease-in-out infinite; }
.walker .wgift img, .walker .wgift svg { width: 100%; height: 100%; }
/* 10/1 찢어진 지도 조각: 모양은 clip-path, 그림자·고른 표시는 drop-shadow (모양을 따라감) */
.p4-jslot.torn { border: 0; background: rgba(255, 244, 224, .16); }
.p4-jslot.torn.filled { background: transparent; }
.p4-piece.torn { background: transparent; box-shadow: none; outline: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .55)); }
.p4-piece.torn.lift { filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .6)); }
.p4-piece.torn.sel, .p4-piece.torn.hint { outline: none; filter: drop-shadow(0 0 6px #ffd66b) drop-shadow(0 0 6px #ffd66b) drop-shadow(0 8px 10px rgba(0, 0, 0, .5)); }
.p4-piece.torn.placed { filter: none; }
.p4-pc { position: absolute; inset: 0; background-repeat: no-repeat; pointer-events: none; }
/* 10/1 가방 마을 지도(실제 지도 + 이름표)와 촌장님 쪽지 */
.item-pop-pic.item-map { position: relative; }
.item-map .im-tag { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-title); font-size: 1em; color: var(--brown); background: rgba(255, 248, 232, .94);
  border: calc(var(--u) * 3) solid #c9a27a; border-radius: 999px; padding: .05em .6em; white-space: nowrap; box-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 8) rgba(0, 0, 0, .3); pointer-events: none; }
.item-pop-pic.item-note { width: min(calc(var(--vw) * 84), calc(var(--u) * 820), calc(var(--vh) * 100)); height: auto; }
.map-pop .item-pop-pic.art img { width: min(calc(var(--vw) * 84), calc((calc(var(--vh) * 94) - 230px) * 1.78), calc(var(--u) * 1500)); height: auto; max-height: none; max-width: none; }   /* 10/1 마을 지도는 크게 (이름표가 읽히게) */
@media (max-height: 520px) { .map-pop .get-desc { display: none; } .map-pop .item-pop-pic.art img { width: min(calc(var(--vw) * 84), calc((calc(var(--vh) * 94) - 150px) * 1.78)); } }
.item-note .p4-note { width: 100%; }
.item-note .p4-note-head { font-size: calc(var(--u) * 46); }
.mstar.p4-askq { z-index: 30; width: 76px; height: 76px; margin: -76px 0 0 -38px; animation: askBob 1.4s ease-in-out infinite; font-family: var(--f-title); font-size: 64px; color: #ffd66b; text-align: center; }
.mstar.p4-askq img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .9)); }
@keyframes askBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.p4-mapstar { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 214, 107, .95)); animation: mapStar 3s ease-in-out infinite; }
@keyframes mapStar { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -56%) scale(1.06); } }
.p4-mapstar img, .p4-mapstar svg { width: 100%; height: 100%; object-fit: contain; }
.item-note .p4-note-head .ico { width: auto; height: 1.4em; }
/* 10/1 도서관 앞 안내 기둥 (마을 지도 시점 이동, 지도 표시) */
.p4-libview { position: absolute; inset: 0; overflow: hidden; background: #1d2340; z-index: 50; }
.p4-lv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.p4-lv-world > img:first-child { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.p4-lv-pole, .p4-mpole { position: absolute; pointer-events: none; filter: drop-shadow(0 0 8px rgba(255, 214, 107, .7)); }
.p4-libview .wavemark { z-index: 2; width: 44px; height: 44px; }
/* 10/1 밤하늘 보기 (가방 옆 단추) */
.modal.sky-view { background-color: #141832; background-size: cover; background-position: center; display: block; }
.sky-view .sky-count { position: absolute; left: 50%; top: calc(var(--sat) + var(--u) * 30); transform: translateX(-50%); }
.sky-view .sky-close { position: absolute; right: calc(var(--sar) + var(--u) * 30); top: calc(var(--sat) + var(--u) * 30); }
/* 10/1 별 축제 불꽃놀이 */
.fw-dot { position: absolute; width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; pointer-events: none; z-index: 40; }
.fw-img { position: absolute; pointer-events: none; z-index: 40; object-fit: contain; }
.p4-tboard.art { background-color: #4b5a4a; background-repeat: no-repeat; overflow: hidden; }
.p4-tboard.art .p4-tcell:not(.has) { background: rgba(255, 255, 255, .12); }

/* 10/1 별 축제 알림 종이 (선생님 그림) */
.pz2-slots { position: relative; }
.pz2-paper { position: absolute; inset: 0; margin: auto; height: 100%; width: auto; max-width: 100%; object-fit: contain; z-index: 2; pointer-events: none; transform-origin: 50% 0; animation: pz2-pin .8s ease-out backwards; transition: opacity .6s; }
.pz2-paper.off { opacity: 0; animation: none; }   /* 10/2: both 로 두면 애니메이션이 opacity 1을 붙잡아 사라지지 않았음 */
@keyframes pz2-pin { from { opacity: 0; transform: translateY(-12%) rotate(-4deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pz2-paper { animation: none; } }

/* 10/1 장소를 끝내면 가운데 큰 지도로 버튼 */
.hud-go { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; z-index: 5; }
.hud-go .pill { font-size: calc(var(--u) * 56 * var(--ts)); min-height: calc(var(--bu) * 130); padding: 0 calc(var(--u) * 64); animation: hud-go-in .5s ease-out both, hud-go-pulse 1.6s ease-in-out .5s infinite; }
@keyframes hud-go-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes hud-go-pulse { 50% { box-shadow: 0 0 0 calc(var(--bu) * 10) rgba(255, 214, 107, .55), 0 calc(var(--bu) * 6) 0 rgba(29, 35, 64, .35); } }
@media (prefers-reduced-motion: reduce) { .hud-go .pill { animation: none; } }
#world { touch-action: none; }   /* 10/2 지도 끌기: 휴대폰에서 끄는 동안 브라우저가 가로채지 않게 */


/* ---- 10/2 제목 화면 「별의 스펙트럼」: 동화책 (title.js G.titleBook) ---- */
.title-screen.tb { overflow: hidden; background: #2a1f18; }
.tb-stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }
.tb-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transition: transform 1.8s cubic-bezier(.45, 0, .25, 1); }
.tb-desk { position: absolute; left: -320px; top: 4px; width: 2240px; height: 1072px; }
.tb-book { position: absolute; left: 31px; top: 105px; width: 1250px; height: 805px; }
.tb-page { background: #faf3e4; }
.tb-pimg { position: absolute; inset: 0; background: center / cover no-repeat; }
.tb-draw { position: absolute; left: 66px; top: 113px; width: 1180px; height: 787px; pointer-events: none; z-index: 5; }
.tb-draw canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transition: opacity 1s; }
.tb-gutter { position: absolute; left: 560px; top: 0; width: 60px; height: 100%; opacity: 0; transition: opacity .8s;
  background: linear-gradient(to right, rgba(60, 40, 20, 0), rgba(60, 40, 20, .22) 50%, rgba(60, 40, 20, 0)); }
.tb.drawing .tb-gutter { opacity: 1; }
.tb.zoomed .tb-gutter { opacity: 0; }
.tb-full { position: absolute; left: 0; top: -100px; width: 1920px; height: 1280px; opacity: 0; transition: opacity .4s; }
/* 10/2 제목·글귀: 선생님 붓글씨 그림 (단색, 테두리 없음, 아래로 옅은 그림자만) */
.tb-brush { position: absolute; pointer-events: none; filter: drop-shadow(0 5px 9px rgba(15, 18, 45, .6)); }
.tb-shade { position: absolute; left: 0; top: 0; width: 1920px; height: 620px; pointer-events: none; opacity: 0; transition: opacity 1s;
  background: radial-gradient(ellipse 34% 52% at 50% 36%, rgba(16, 20, 52, .5), rgba(16, 20, 52, .22) 60%, transparent 100%); }
.title-screen.tb .tb-open, .title-screen.tb .t-start { position: absolute; left: 50%; bottom: calc(6% + var(--sab)); transform: translateX(-50%); min-width: calc(var(--u) * 320);
  min-height: max(calc(var(--u) * 120), calc(var(--bu) * 100)); font-size: calc(var(--u) * 48); transition: opacity .6s, transform .15s; }
.title-screen.tb .tb-open:active, .title-screen.tb .t-start:active { transform: translateX(-50%) translateY(calc(var(--u) * 4)); }
.tb.open .tb-open { opacity: 0; pointer-events: none; }
.tb .t-start { opacity: 0; pointer-events: none; }
.tb.done .t-start { opacity: 1; pointer-events: auto; }
.tb .t-note { bottom: auto; top: calc(var(--sat) + var(--u) * 14); left: calc(var(--sal) + var(--u) * 24); transform: none; width: auto; max-width: 30%; text-align: left; }

/* ---- 10/2 선생님: 배경이 빈 화면에 어울리는 그림을 흐릿하게 (bgfill.js가 --bg-* 를 정함, 그림이 없으면 원래 색) ---- */
.slots-screen.mode-screen { background: linear-gradient(rgba(31, 37, 72, .5), rgba(31, 37, 72, .62)), var(--bg-mode, none) center / cover no-repeat, #2a3160; }
.slots-screen.rv-screen { background: linear-gradient(rgba(31, 37, 72, .35), rgba(31, 37, 72, .5)), var(--bg-slots, none) center / cover no-repeat, #2a3160; }
#rotate { background: linear-gradient(rgba(31, 37, 72, .5), rgba(31, 37, 72, .6)), var(--bg-slots, none) center / cover no-repeat, var(--ink); }
.puzzle:not(.p4):not(.pz2) { background: linear-gradient(rgba(40, 28, 18, .45), rgba(40, 28, 18, .55)), var(--bg-library, none) center / cover no-repeat, #5a3d28; }
.puzzle.pz2, .puzzle.p4-wipe, .puzzle.p4-tiles { background: linear-gradient(rgba(23, 27, 54, .45), rgba(23, 27, 54, .55)), var(--bg-plaza, none) center / cover no-repeat, #262c52; }
.puzzle.p4-jig { background: linear-gradient(rgba(23, 27, 54, .45), rgba(23, 27, 54, .55)), var(--bg-market, none) center / cover no-repeat, #262c52; }
.puzzle.p4-ff { background: linear-gradient(rgba(8, 19, 15, .5), rgba(8, 19, 15, .6)), var(--bg-forest, none) center / cover no-repeat, #10241c; }
.puzzle.s2-pz.p4-door, .puzzle.s2-seats { background: linear-gradient(rgba(23, 27, 54, .45), rgba(23, 27, 54, .55)), var(--bg-s2hall, none) center / cover no-repeat, #1b1f3a; }
.puzzle.s2-box { background: linear-gradient(rgba(40, 28, 18, .45), rgba(40, 28, 18, .55)), var(--bg-s2rest, none) center / cover no-repeat, #5a3d28; }

/* 10/2 선생님: 저장 칸 = 제목 화면의 책 (save.js bookPick). 양피지 쪽 + 가운데 수채 그림 + 나눔손글씨 */
.slots-screen.bk-screen { background: linear-gradient(rgba(20, 12, 6, .25), rgba(20, 12, 6, .45)), var(--desk) center / cover no-repeat, #3b2617; }
.bk-screen .s-head h2 { text-shadow: 0 0 calc(var(--u) * 12) rgba(0, 0, 0, .8), 0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0, 0, 0, .6); }
.bk-area { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.bk-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.bk-book { position: absolute; left: 335px; top: 105px; width: 1250px; height: 805px; }
.bk-page { background: #f3e2c0; }
.bk-paper { position: absolute; inset: 0; background: center / 100% 100% no-repeat; }
.bk-page.pl .bk-paper { transform: scaleX(-1); }
.bk-gut { position: absolute; top: 0; bottom: 0; width: 90px; pointer-events: none; }
.bk-page.pl .bk-gut { right: 0; background: linear-gradient(90deg, transparent, rgba(90, 60, 30, .3)); }
.bk-page.pr .bk-gut { left: 0; background: linear-gradient(270deg, transparent, rgba(90, 60, 30, .3)); }
.bk-ill { position: absolute; left: 30px; right: 30px; top: 60px; bottom: 150px; background: center / cover no-repeat; mix-blend-mode: multiply; opacity: .95; filter: saturate(.85);
  -webkit-mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); mask: radial-gradient(closest-side, #000 35%, rgba(0, 0, 0, .55) 65%, transparent 100%); }
.bk-slot { position: absolute; inset: 30px; cursor: pointer; border-radius: 40px; transition: box-shadow .25s; }
.bk-slot .cap { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-family: 'NanumPen', var(--f-title); font-size: 76px; line-height: 1; color: #4a3220; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-slot.empty .cap { color: rgba(74, 50, 32, .7); }
.bk-slot .meta { position: absolute; top: 16px; right: 24px; display: flex; align-items: center; gap: .15em; font-family: 'NanumPen', var(--f-title); font-size: 56px; color: #8a5a10; }
.bk-slot .meta .ico { height: 1em; }
.bk-slot.sel { box-shadow: inset 0 0 0 6px rgba(220, 160, 40, .6), 0 0 36px rgba(255, 214, 107, .55); }
.bk-slot.picked { box-shadow: inset 0 0 0 10px rgba(240, 180, 40, .9), 0 0 60px rgba(255, 214, 107, .9); }
.bk-board { position: absolute; left: 293px; top: 69px; width: 1334px; height: 877px; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .5)); }
.bk-cv { position: absolute; top: 0; bottom: 0; width: 50%; background: center / cover no-repeat #3c3f86; border: 3px solid #23264f; box-shadow: inset 0 0 26px rgba(10, 10, 40, .55); }
.bk-cv.l { left: 0; border-radius: 18px 6px 6px 18px; transform: scaleX(-1); }
.bk-cv.r { right: 0; border-radius: 6px 18px 18px 6px; }
.bk-board::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 34px; margin-left: -17px; background: linear-gradient(90deg, rgba(15, 15, 45, 0), rgba(15, 15, 45, .55), rgba(15, 15, 45, 0)); }
.bk-book::before { content: ''; position: absolute; inset: 0; box-shadow: 0 2px 10px rgba(20, 15, 40, .55); pointer-events: none; }
/* 10/2 선생님: 휴대폰에서 책을 크게. 머리글은 작게, 버튼은 책 바깥 양옆과 아래 구석으로 */
.bk-screen .s-head { min-height: calc(var(--u) * 84); }
.bk-screen .s-head h2 { font-size: calc(var(--u) * 40 * var(--ts)); }
.bk-screen .s-head .pill.round { width: calc(var(--bu) * 76) !important; height: calc(var(--bu) * 76) !important; }
.bk-screen .rv-nav { position: absolute; inset: 0; padding: 0; pointer-events: none; }
.bk-screen .rv-nav > * { position: absolute; pointer-events: auto; }
.bk-screen .rv-nav .rv-back { left: calc(var(--sal) + var(--u) * 20); top: auto; bottom: calc(var(--sab) + var(--u) * 20); }
.bk-screen .rv-nav .rv-arrow { top: 59%; width: calc(var(--bu) * 104); height: calc(var(--bu) * 104); }
.bk-screen .rv-nav .rv-arrow.prev { left: calc(var(--sal) + var(--u) * 20); }
.bk-screen .rv-nav .rv-arrow:not(.prev) { right: calc(var(--sar) + var(--u) * 20); }
.bk-screen .rv-nav .rv-ok { right: calc(var(--sar) + var(--u) * 20); bottom: calc(var(--sab) + var(--u) * 20); }
/* 10/2 선생님: 휴대폰을 세로로 들면 게임 화면을 90도 돌려 가로처럼 보여 줌 (core.js G.layout). 안전 영역도 돌려서 맞춤 */
html.rot90 { --sal: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-left, 0px); }
