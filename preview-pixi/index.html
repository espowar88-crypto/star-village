<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쉼터 시험</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 10/28 쉼터 한 곳 시험: 지금 방식(img 두 장) 과 PixiJS+압축 그림(KTX2 UASTC) 을 같은 움직임으로 비교 */
html,body{margin:0;height:100%;background:#1d2420;color:#f2f5f1;font-family:'Jua',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden}
#stage img,#stage .ov{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;will-change:transform}
#bar{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
#bar a{background:#2f7d5b;color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;font-size:17px}
#bar a.on{background:#f2f5f1;color:#1d2420}
#info{background:rgba(0,0,0,.55);border-radius:8px;padding:6px 10px;font-size:16px}
/* 밤빛 지금 방식: 게임 style.css .dusk-* 와 같은 겹 */
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world>*{position:absolute;left:0;top:0;width:3500px;height:2440px}
.dusk-img{filter:saturate(.4) brightness(1.0488);image-rendering:pixelated}
.dusk-tint{background:rgb(197,212,255);mix-blend-mode:multiply}
.dusk-lift{background:rgb(4,4,4);mix-blend-mode:screen}
.dusk-warm{background:url(color.webp) 0 0/100% 100%;-webkit-mask:url(warm.png) 0 0/100% 100% no-repeat;mask:url(warm.png) 0 0/100% 100% no-repeat;image-rendering:pixelated}
</style></head><body>
<div id="stage"></div>
<div id="bar"><a href="?mode=img" id="m-img">지금 방식</a><a href="?mode=pixi" id="m-pixi">PixiJS + 압축 그림</a><a href="?mode=duskimg" id="m-duskimg">밤빛: 지금 방식</a><a href="?mode=duskpixi" id="m-duskpixi">밤빛: PixiJS</a><span id="info">준비 중</span></div>
<script src="pixi.min.js"></script>
<script>
const W = 3500, H = 2440, HERO = [819, 1684, 48, 130];
const mode = new URLSearchParams(location.search).get('mode') || 'img';
document.getElementById('m-' + mode).classList.add('on');
const info = document.getElementById('info'), stage = document.getElementById('stage');
let t0 = performance.now(), frames = 0, worst = 0, last = 0, ready = 0;
window.__stat = { mode, fps: 0, worst: 0, ready: 0, err: '' };
// 화면 높이에 그림 높이의 절반이 보이게, 좌우로 천천히 오감(장면 안 걷기 흉내)
const cam = (t) => { const k = Math.max(innerHeight / (H * 0.5), innerWidth / (W * 0.5)), vw = innerWidth / k, vh = innerHeight / k; const u = (Math.sin(t / 2500) + 1) / 2; return { k, x: -(u * (W - vw)), y: -((H - vh) * 0.6) }; };
const tick = (t) => {
  if (ready) { frames++; if (last) worst = Math.max(worst, t - last); last = t;
    if (t - t0 > 1000) { __stat.fps = Math.round(frames * 1000 / (t - t0)); __stat.worst = Math.round(worst); info.textContent = ({ img: '지금 방식', pixi: 'PixiJS', duskimg: '밤빛 지금 방식', duskpixi: '밤빛 PixiJS' })[mode] + ` · ${__stat.fps}fps · 가장 긴 멈춤 ${__stat.worst}ms · 준비 ${__stat.ready}ms`; frames = 0; worst = 0; t0 = t; } }
  requestAnimationFrame(tick);
};
requestAnimationFrame(tick);
const t00 = performance.now();
if (mode === 'duskimg') {
  // 크롬 게임과 같은 밤빛: 색 그림+흐리게 거르기 → 곱하기 판 → 더하기 판 → 불빛(색 그림을 가림 그림으로 오림), 모두 3500×2440
  const w = document.createElement('div'); w.id = 'world'; stage.appendChild(w);
  w.innerHTML = '<img class="dusk-img" src="color.webp" width="3500" height="2440"><div class="dusk-tint"></div><div class="dusk-lift"></div><div class="dusk-warm"></div><img src="hero.webp" style="width:' + HERO[2] + 'px;height:' + HERO[3] + 'px;left:' + HERO[0] + 'px;top:' + HERO[1] + 'px">';
  const pre = new Image(); pre.src = 'warm.png';
  Promise.all([w.querySelector('img').decode(), pre.decode()]).then(() => { ready = 1; __stat.ready = Math.round(performance.now() - t00); });
  const move = (t) => { const c = cam(t); w.style.transform = `scale(${c.k}) translate(${c.x}px,${c.y}px)`; requestAnimationFrame(move); };
  requestAnimationFrame(move);
} else if (mode === 'duskpixi') {
  // PixiJS 밤빛: 색 그림 한 장을 그릴 때 그래픽 칩이 점마다 밤빛을 계산(겹 없음). 불빛 자리는 작은 가림 그림으로 원래 색
  (async () => {
    try {
      PIXI.setKTXTranscoderPath({ jsUrl: new URL('libktx.js', location.href).href, wasmUrl: new URL('libktx.wasm', location.href).href });
      PIXI.extensions.add(PIXI.loadKTX2, PIXI.detectCompressed, PIXI.resolveCompressedTextureUrl);
      const app = new PIXI.Application();
      await app.init({ resizeTo: window, background: '#1d2420', antialias: false, preference: 'webgl', resolution: Math.min(devicePixelRatio || 1, 2), autoDensity: true });
      stage.appendChild(app.canvas);
      const [c, wm, h] = await Promise.all([PIXI.Assets.load('color_uastc.ktx2'), PIXI.Assets.load('warm_uastc.ktx2'), PIXI.Assets.load('hero.webp')]);
      for (const tx of [c, wm, h]) tx.source.scaleMode = 'linear';
      for (const tx of [c, wm]) tx.source.alphaMode = 'premultiply-alpha-on-upload';
      const vertex = `in vec2 aPosition; in vec2 aUV; out vec2 vUV;
uniform mat3 uProjectionMatrix; uniform mat3 uWorldTransformMatrix; uniform mat3 uTransformMatrix;
void main(){ mat3 mvp = uProjectionMatrix * uWorldTransformMatrix * uTransformMatrix; gl_Position = vec4((mvp * vec3(aPosition, 1.0)).xy, 0.0, 1.0); vUV = aUV; }`;
      // 게임 G.duskPx 와 같은 계산: 회색 쪽으로 0.4만 남기고 밝게 1.0488 → 푸른빛 곱하기 → 4/255 더하기, 불빛 자리는 원래 색
      const fragment = `in vec2 vUV; out vec4 finalColor;
uniform sampler2D uColor; uniform sampler2D uWarm; uniform float uAmt;
void main(){ vec3 c = texture(uColor, vUV).rgb; float g = dot(c, vec3(.2126, .7152, .0722));
  vec3 v = min(vec3(1.0), (vec3(g) + (c - vec3(g)) * .4) * 1.0488) * vec3(197.0/255.0, 212.0/255.0, 1.0);
  v = 1.0 - (1.0 - v) * (251.0/255.0); v = mix(v, c, texture(uWarm, vUV).a);
  finalColor = vec4(mix(c, v, uAmt), 1.0); }`;
      const geometry = new PIXI.Geometry({ attributes: { aPosition: [0, 0, W, 0, W, H, 0, H], aUV: [0, 0, 1, 0, 1, 1, 0, 1] }, indexBuffer: [0, 1, 2, 0, 2, 3] });
      const shader = PIXI.Shader.from({ gl: { vertex, fragment }, resources: { uColor: c.source, uWarm: wm.source, duskU: { uAmt: { value: 1, type: 'f32' } } } });
      const world = new PIXI.Container(); app.stage.addChild(world);
      const bg = new PIXI.Mesh({ geometry, shader }), sh = new PIXI.Sprite(h); sh.position.set(HERO[0], HERO[1]); sh.width = HERO[2]; sh.height = HERO[3];
      world.addChild(bg, sh);
      __stat.fmt = c.source.format; ready = 1; __stat.ready = Math.round(performance.now() - t00);
      app.ticker.add(() => { const k = cam(performance.now()); world.scale.set(k.k); world.position.set(k.x * k.k, k.y * k.k); });
    } catch (e) { __stat.err = String(e && e.message || e); info.textContent = '오류: ' + __stat.err; }
  })();
} else if (mode === 'img') {
  const mk = (src, op) => { const i = new Image(); i.src = src; i.width = W; i.height = H; i.style.opacity = op; stage.appendChild(i); return i; };
  const ims = [mk('color.webp', 1), mk('mono.webp', .55), mk('hero.webp', 1)];
  ims[2].width = HERO[2]; ims[2].height = HERO[3];
  Promise.all(ims.map((i) => i.decode())).then(() => { ready = 1; __stat.ready = Math.round(performance.now() - t00); });
  const move = (t) => { const c = cam(t); ims[0].style.transform = ims[1].style.transform = `scale(${c.k}) translate(${c.x}px,${c.y}px)`; ims[2].style.transform = `scale(${c.k}) translate(${c.x + HERO[0]}px,${c.y + HERO[1]}px)`; requestAnimationFrame(move); };
  requestAnimationFrame(move);
} else {
  (async () => {
    try {
      PIXI.setKTXTranscoderPath({ jsUrl: new URL('libktx.js', location.href).href, wasmUrl: new URL('libktx.wasm', location.href).href });
      PIXI.extensions.add(PIXI.loadKTX2, PIXI.detectCompressed, PIXI.resolveCompressedTextureUrl);   // 압축 그림 불러오기는 따로 켜야 함
      const app = new PIXI.Application();
      await app.init({ resizeTo: window, background: '#1d2420', antialias: false, preference: 'webgl', resolution: Math.min(devicePixelRatio || 1, 2), autoDensity: true });   // 10/28 휴대폰 고해상도 화면에 맞춰 그림(1배로 그리면 흐리고 일렁임)
      stage.appendChild(app.canvas);
      const [c, m, h] = await Promise.all([PIXI.Assets.load('color_uastc.ktx2'), PIXI.Assets.load('mono_uastc.ktx2'), PIXI.Assets.load('hero.webp')]);
      for (const tx of [c, m, h]) tx.source.scaleMode = 'linear';
      for (const tx of [c, m]) tx.source.alphaMode = 'premultiply-alpha-on-upload';   // 10/28 압축 그림은 '안 곱함'으로 읽혀 반투명 겹이 두 번 곱해져 어두웠음(그림에 투명 부분이 없어 이렇게 둬도 같음)   // 10/28 nearest는 줄여 보일 때 움직이면 일렁임 → 지금 방식처럼 부드럽게 섞기
      const world = new PIXI.Container(); app.stage.addChild(world);
      const sc = new PIXI.Sprite(c), sm = new PIXI.Sprite(m), sh = new PIXI.Sprite(h); sm.alpha = .55; sh.position.set(HERO[0], HERO[1]); sh.width = HERO[2]; sh.height = HERO[3];
      world.addChild(sc, sm, sh);
      __stat.fmt = c.source.format; ready = 1; __stat.ready = Math.round(performance.now() - t00);
      app.ticker.add(() => { const k = cam(performance.now()); world.scale.set(k.k); world.position.set(k.x * k.k, k.y * k.k); });
    } catch (e) { __stat.err = String(e && e.message || e); info.textContent = '오류: ' + __stat.err; }
  })();
}
</script></body></html>
