:root { --bg: #1b2146; --paper: #FFF8E8; --gold: #FFD66B; --ink: #4A3B32; --soft: #FFF6D6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse at 50% 35%, #2c3570 0%, var(--bg) 70%); color: var(--soft); font-family: 'BMJUA', sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
h1 { font-weight: normal; font-size: 30px; margin: 0; }
.card { width: 240px; height: 240px; background: var(--paper); border: 8px solid var(--gold); border-radius: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--ink); }
.card img { width: 140px; height: 140px; object-fit: contain; }
.card b { font-weight: normal; font-size: 30px; }
.card.spin img { animation: wob .18s linear infinite; }
@keyframes wob { 50% { transform: rotate(12deg) scale(1.08); } }
.card.won { animation: pop .7s ease-out; box-shadow: 0 0 40px rgba(255, 214, 107, .7); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
p { margin: 0; font-size: 20px; line-height: 1.5; }
button { font: inherit; font-size: 26px; color: var(--ink); background: linear-gradient(#FFE9A8, var(--gold)); border: 4px solid #B8873A; border-radius: 999px; padding: 12px 40px; cursor: pointer; }
button[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .card.spin img, .card.won { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>길의 별을 되찾았어요!</h1>
  <div class="card" id="card"><img id="pic" alt=""><b id="name">?</b></div>
  <p id="msg">선물 뽑기를 눌러 보세요.</p>
  <button id="go" type="button">선물 뽑기</button>
</main>
<script>
// 선물 목록: 이름과 그림만 바꾸면 됨 (그림은 본 게임 별 그림)
const GIFTS = [
  { name: '1번 선물', pic: '../assets/ui/stars/star_road.webp' },
  { name: '2번 선물', pic: '../assets/ui/stars/star_sound.webp' },
  { name: '3번 선물', pic: '../assets/ui/stars/star_word.webp' },
  { name: '4번 선물', pic: '../assets/ui/stars/star_heart.webp' },
];
const KEY = 'starvillage.demoGift';
const $ = (id) => document.getElementById(id);
const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
const set = (v) => { try { localStorage.setItem(KEY, v); } catch (e) { } };
if (/[?&]reset=1/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) { } }
GIFTS.forEach(g => { const i = new Image(); i.src = g.pic; });
const show = (g) => { $('pic').src = g.pic; $('name').textContent = g.name; };
const done = (g, again) => {
  show(g); $('card').classList.remove('spin'); $('card').classList.add('won'); $('go').hidden = true;
  $('msg').textContent = again ? '이미 뽑았어요. 이 화면을 선생님께 보여 주세요.' : '축하해요! 이 화면을 선생님께 보여 주세요.';
};
const old = GIFTS.find(g => g.name === get());
if (old) done(old, true); else show({ pic: GIFTS[0].pic, name: '?' });
$('go').addEventListener('click', () => {
  $('go').hidden = true; $('msg').textContent = '두근두근...'; $('card').classList.add('spin');
  const pick = GIFTS[Math.floor(Math.random() * GIFTS.length)];
  set(pick.name);
  let n = 0; const t = setInterval(() => { show(GIFTS[n++ % GIFTS.length]); $('name').textContent = '?'; }, 120);
  setTimeout(() => { clearInterval(t); done(pick, false); }, 1800);
});
</script>
</body>
</html>
